# ArgoCD Helm values for LOCAL kind dev. Not production-tuned.
# Installed by scripts/bootstrap.sh (argo/argo-cd chart).
global:
  domain: argocd.localhost

configs:
  params:
    # Serve plain HTTP so `kubectl port-forward` → http://localhost:8080 works
    # without TLS warnings. Do NOT do this in production.
    server.insecure: true
    # Allow Applications to live/target any namespace (apps, tenant-*, etc.)
    application.namespaces: "*"
    # Compute diffs server-side so the API server's schema is used. Avoids
    # "field not declared in schema" ComparisonErrors when the cluster's k8s
    # version is newer than the schema bundled in this ArgoCD version
    # (e.g. k8s 1.33's Deployment .status.terminatingReplicas).
    controller.diff.server.side: "true"
  cm:
    resource.customizations.health.argoproj.io_Rollout: |
      hs = {}
      if obj.status ~= nil and obj.status.phase ~= nil then
        if obj.status.phase == "Healthy" then
          hs.status = "Healthy"
        elseif obj.status.phase == "Degraded" then
          hs.status = "Degraded"
        elseif obj.status.phase == "Paused" then
          hs.status = "Suspended"
        else
          hs.status = "Progressing"
        end
        if obj.status.message ~= nil then
          hs.message = obj.status.message
        end
        return hs
      end
      hs.status = "Progressing"
      hs.message = "Waiting for Rollout status"
      return hs

# Trim resources so the whole stack fits on a laptop kind cluster
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# ApplicationSet controller is needed for the multi-tenancy ApplicationSet
applicationSet:
  enabled: true

# Dex/notifications not needed for local dev
dex:
  enabled: false
notifications:
  enabled: false
