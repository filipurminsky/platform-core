# ---------------------------------------------------------------------------
# Tenant network isolation — zero-trust baseline.
#
# Order of evaluation in Kubernetes is additive (policies are OR-ed). We start
# from a default-deny posture and then open the minimum required paths:
#   1. default-deny-all        — drop all ingress + egress
#   2. allow-dns               — egress to CoreDNS (every pod needs name resolution)
#   3. allow-intra-namespace   — pods within the tenant may talk to each other
#   4. allow-from-ingress      — ingress-nginx may reach tenant workloads
#   5. allow-from-monitoring   — Prometheus may scrape /metrics
#   6. allow-to-platform       — egress to shared services: Kafka (platform ns)
#                                and vLLM (apps ns)
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-platform
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Kafka (Strimzi) runs in the platform namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
      ports:
        - protocol: TCP
          port: 9092   # Kafka bootstrap
        - protocol: TCP
          port: 9093   # Kafka TLS
    # The llm-gateway (apps namespace) is the only sanctioned entrypoint to the
    # model — it enforces per-IP rate limiting and observability. Tenants reach
    # the gateway, NOT vllm-inference (:8000) directly; routing them to :8000
    # would bypass the gateway the architecture exists to funnel them through
    # (and vllm-inference's own NetworkPolicy already restricts ingress to the
    # gateway, so this is defence in depth).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
      ports:
        - protocol: TCP
          port: 80     # llm-gateway Service port
        - protocol: TCP
          port: 8080   # llm-gateway container port (post-Service-translation)
