# Binds the shared tenant roles to team-alpha's OIDC groups.
# Group names are the claims your IdP emits (e.g. via Dex / Cognito / Entra).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "oidc:team-alpha-admins"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-viewer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "oidc:team-alpha-viewers"
