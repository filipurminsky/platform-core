# Enforce that every image from our registry is cryptographically signed by the
# CI workflow (cosign keyless). Unsigned or tampered images are rejected at
# admission — the runtime counterpart to signing in docker-build.yaml.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Image Signatures (cosign keyless)
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  background: false
  rules:
    - name: verify-cosign-keyless
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        # Only our project images must be signed. Upstream platform images
        # (Strimzi, ingress-nginx, etc.) come from other registries and are not
        # matched, so they are unaffected.
        - imageReferences:
            - "*.dkr.ecr.*.amazonaws.com/platform-core/*"
          required: true
          mutateDigest: true # pin to the verified digest
          verifyDigest: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    # Identity that signed the image == our GitHub Actions workflow
                    subject: "https://github.com/filipurminsky/platform-core/.github/workflows/docker-build.yaml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
