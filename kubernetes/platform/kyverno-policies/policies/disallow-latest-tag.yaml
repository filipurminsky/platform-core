# Audit (not Enforce) so local/dev :latest images still run, but every use is
# reported in a PolicyReport. Production images are promoted by immutable SHA tag
# via docker-build.yaml, so prod stays clean.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow :latest image tag
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-immutable-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - argocd
                - argo-rollouts
                - platform
                - monitoring
                - cert-manager
                - ingress-nginx
                - external-secrets
                - keda
      validate:
        message: "Using ':latest' is not allowed; pin an immutable tag or digest."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
