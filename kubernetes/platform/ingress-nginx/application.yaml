apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.10.1
    helm:
      values: |
        # NOTE: kind/local-tuned. For EKS use service.type: LoadBalancer, drop
        # hostPort/nodeSelector/tolerations, and re-enable admissionWebhooks.
        controller:
          replicaCount: 1
          hostPort:
            enabled: true            # bind :80/:443 on the node (kind maps these to localhost)
          service:
            type: NodePort
          nodeSelector:
            ingress-ready: "true"    # only the kind control-plane node has this label
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          admissionWebhooks:
            enabled: false           # self-signed webhook cert breaks ArgoCD's diff + Ingress creation on kind
          resources:
            requests:
              cpu: 100m
              memory: 90Mi
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
