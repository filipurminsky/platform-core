apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    # v1.21.x — upgraded from v1.14.5. `installCRDs` is deprecated (and fails
    # if combined with its replacement); CRDs are now managed via crds.enabled.
    # crds.keep adds helm.sh/resource-policy: keep so pruning the app never
    # cascades into deleting every Certificate/Issuer. Note v1.18+ defaults
    # Certificate.spec.privateKey.rotationPolicy to Always.
    targetRevision: v1.21.3
    helm:
      values: |
        crds:
          enabled: true
          keep: true
        global:
          leaderElection:
            namespace: cert-manager
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
