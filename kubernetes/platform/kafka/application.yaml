apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Kafka CRs need the Strimzi operator + CRDs first (strimzi app is wave -1)
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/filipurminsky/platform-core.git
    targetRevision: main
    # LOCAL/kind uses the dev overlay (1 broker, 1 ZK, no TLS/SCRAM, standard
    # storage). Switch to overlays/prod for EKS.
    path: kubernetes/platform/kafka/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
