# Prod: spread the 3 KRaft nodes (controller+broker) one per AZ. Hard zone
# constraint (DoNotSchedule) so a single-AZ outage can never take out a
# controller-quorum majority or 2 replicas of a partition; gp3 PVCs are
# zone-bound (WaitForFirstConsumer), so each broker stays in its zone afterwards.
# Requires the 3-AZ EKS node layout (Karpenter NodePools spanning all 3 zones).
- op: add
  path: /spec/template
  value:
    pod:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: platform-kafka
              strimzi.io/pool-name: kafka
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              strimzi.io/cluster: platform-kafka
              strimzi.io/pool-name: kafka
