apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Prod: base (3 KRaft nodes, combined controller+broker, 5 partitions, SCRAM
# auth, gp3 storage) plus:
#   - patch-kafka-prod.yaml     — drop the plaintext :9092 listener (TLS-only)
#                                 and enable rack awareness (zone = rack)
#   - patch-nodepool-prod.yaml  — spread brokers one-per-AZ across 3 zones
resources:
  - ../../base
patches:
  - path: patch-kafka-prod.yaml
    target:
      kind: Kafka
      name: platform-kafka
  - path: patch-nodepool-prod.yaml
    target:
      kind: KafkaNodePool
      name: kafka
