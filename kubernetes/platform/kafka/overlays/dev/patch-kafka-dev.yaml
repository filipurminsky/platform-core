# Dev: single KRaft node, no SCRAM auth, no Kafka Exporter. Node count and
# storage class are patched on the KafkaNodePool (patch-nodepool-dev.yaml).
- op: replace
  path: /spec/kafka/config/default.replication.factor
  value: "1"

- op: replace
  path: /spec/kafka/config/min.insync.replicas
  value: "1"

- op: add
  path: /spec/kafka/config/offsets.topic.replication.factor
  value: "1"

- op: add
  path: /spec/kafka/config/transaction.state.log.replication.factor
  value: "1"

- op: add
  path: /spec/kafka/config/transaction.state.log.min.isr
  value: "1"

# Disable listener auth in dev (simplifies local testing)
- op: remove
  path: /spec/kafka/listeners/0/authentication

- op: remove
  path: /spec/kafka/listeners/1/authentication

# Disable Kafka Exporter in dev (saves resources)
- op: remove
  path: /spec/kafkaExporter
