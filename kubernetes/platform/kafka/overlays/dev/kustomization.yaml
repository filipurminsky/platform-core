apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # Single KRaft node — minimal footprint on kind
  - path: patch-kafka-dev.yaml
    target:
      kind: Kafka
      name: platform-kafka
  - path: patch-nodepool-dev.yaml
    target:
      kind: KafkaNodePool
      name: kafka
  # Single partition + single replica per topic
  - path: patch-topics-dev.yaml
    target:
      kind: KafkaTopic

  # Dev uses the unauthenticated internal Kafka listener.
  - path: patch-users-dev.yaml
