# Kafka is environment-selected via the cluster generator: the destination
# cluster's `environment` label (set by bootstrap.sh — dev for kind, prod for
# EKS) drives the overlay path. dev = 1 KRaft node, no SCRAM auth, plaintext
# :9092 listener, standard storage; prod = 3 KRaft nodes spread over 3 AZs
# (rack-aware), SCRAM over TLS :9093 only, gp3. Switching never edits this file.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kafka
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: Exists
  template:
    metadata:
      name: kafka
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        # Kafka CRs need the Strimzi operator + CRDs first (strimzi app is wave -1)
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      source:
        repoURL: https://github.com/filipurminsky/platform-core.git
        targetRevision: main
        path: kubernetes/platform/kafka/overlays/{{.metadata.labels.environment}}
      destination:
        server: "{{.server}}"
        namespace: platform
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # External operator CRDs can become ready after the first sync attempts.
        # Retry until they exist; the bootstrap readiness wait remains bounded.
        retry:
          limit: -1
          refresh: true
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 60s
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
