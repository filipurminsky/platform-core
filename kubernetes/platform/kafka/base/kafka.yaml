# Strimzi Kafka cluster — KRaft mode (ZooKeeper-less).
# Node count and storage live in the KafkaNodePool (nodepool.yaml); this resource
# carries cluster-wide config (listeners, replication, operators). Kustomize
# overlays (dev/prod) patch replica counts, storage class, and auth settings.
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: platform-kafka
  namespace: platform
  annotations:
    strimzi.io/node-pools: enabled   # broker/controller topology defined by KafkaNodePool CRs
    strimzi.io/kraft: enabled        # no ZooKeeper — Raft-based metadata quorum
spec:
  kafka:
    version: "3.7.0"
    metadataVersion: "3.7-IV4"       # KRaft metadata version (tracks Kafka version)
    # replicas + storage are intentionally omitted: in node-pool mode they are
    # defined per-pool in nodepool.yaml, not here.
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512             # patched out in dev overlay
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512             # patched out in dev overlay
    config:
      default.replication.factor: "3"    # patched to "1" in dev overlay
      min.insync.replicas: "2"           # patched to "1" in dev overlay
      log.retention.hours: "168"
      log.segment.bytes: "1073741824"
      auto.create.topics.enable: "false" # all topics managed via KafkaTopic CRs
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    readinessProbe:
      initialDelaySeconds: 15
      timeoutSeconds: 5
    livenessProbe:
      initialDelaySeconds: 15
      timeoutSeconds: 5
  entityOperator:
    topicOperator: {}                    # watches KafkaTopic CRs
    userOperator:
      watchedNamespace: apps             # creates KafkaUser Secrets where apps/KEDA consume them
  kafkaExporter:                         # exposes consumer group lag to Prometheus
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      requests:
        cpu: 200m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
