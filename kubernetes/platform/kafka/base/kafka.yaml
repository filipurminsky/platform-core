# Strimzi Kafka cluster
# Kustomize overlays (dev/prod) patch replica counts, storage class, and auth settings.
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: platform-kafka
  namespace: platform
spec:
  kafka:
    replicas: 3                          # patched to 1 in dev overlay
    version: "3.7.0"
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512             # patched out in dev overlay
    config:
      default.replication.factor: "3"    # patched to "1" in dev overlay
      min.insync.replicas: "2"           # patched to "1" in dev overlay
      log.retention.hours: "168"
      log.segment.bytes: "1073741824"
      auto.create.topics.enable: "false" # all topics managed via KafkaTopic CRs
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 20Gi
          class: gp3                     # patched to "standard" in dev overlay
          deleteClaim: false
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    readinessProbe:
      initialDelaySeconds: 15
      timeoutSeconds: 5
    livenessProbe:
      initialDelaySeconds: 15
      timeoutSeconds: 5
  zookeeper:
    replicas: 3                          # patched to 1 in dev overlay
    storage:
      type: persistent-claim
      size: 5Gi
      class: gp3
      deleteClaim: false
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  entityOperator:
    topicOperator: {}                    # watches KafkaTopic CRs
    userOperator: {}                     # watches KafkaUser CRs
  kafkaExporter:                         # exposes consumer group lag to Prometheus
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      requests:
        cpu: 200m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
