# KafkaNodePool — defines the node count, roles, and storage for the KRaft
# cluster. A single combined controller+broker pool keeps the footprint small
# (N pods total) versus the old ZooKeeper topology (N brokers + M ZK nodes).
# The dev overlay patches replicas → 1 and storage class → standard.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: kafka
  namespace: platform
  labels:
    strimzi.io/cluster: platform-kafka   # binds this pool to the Kafka CR above
spec:
  replicas: 3                            # patched to 1 in dev overlay
  roles:
    - controller                         # KRaft metadata quorum
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        class: gp3                       # patched to "standard" in dev overlay
        deleteClaim: false
