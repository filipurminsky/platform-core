apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Operator + CRDs must exist before the Kafka/KafkaTopic/KafkaUser CRs (kafka app, wave 0)
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 0.40.0
    helm:
      values: |
        watchAnyNamespace: false
        # Watch `apps` in addition to the install namespace (platform). The Kafka
        # CR's User Operator runs with watchedNamespace=apps so the worker-service
        # KafkaUser secret is created where the worker + KEDA TriggerAuthentication
        # consume it (the secret-ownership split). Without this the chart grants
        # the operator no RBAC in `apps`, so it 403s creating the entity-operator
        # Role there and the Kafka cluster never goes Ready.
        watchNamespaces:
          - apps
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
