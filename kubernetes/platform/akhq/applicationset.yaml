# AKHQ — dev-only Kafka web UI for topic / consumer-group / message inspection.
#
# Convenience surface for local development. Browse topics, peek at messages,
# and watch consumer-group lag without dropping into console-consumer pods.
# This duplicates nothing functional: prod relies on Grafana + Kafka Exporter
# for lag and `kubectl get kafkatopics` (Strimzi CRs) for topic state.
#
# Scoped to dev only (cluster generator matches environment=dev), like SeaweedFS.
# The reason it is dev-only is the listener split: the dev Kafka overlay keeps
# the plaintext :9092 listener WITHOUT authentication, so the connection below
# works as-is. Prod has no :9092 listener at all (TLS + SCRAM-SHA-512 on :9093
# only) — wiring AKHQ there would need an `akhq` KafkaUser CR, the reflected
# cluster CA (apps-only today) and SASL_SSL/jaas config, which we skip.
#
# Access in dev: http://akhq.platform-core.local via the shared Envoy Gateway
#   (HTTPRoute → Gateway envoy-gateway-system/platform), or
#   kubectl -n platform port-forward svc/akhq 9080:8080
#
# Chart 0.28.0 renders the HTTPRoute natively (`httpRoute.*`, gateway.networking.k8s.io/v1);
# verified with `helm template akhq akhq/akhq --version 0.28.0 -f <these values>`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: akhq
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values: ["dev"]
  template:
    metadata:
      name: akhq
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://akhq.io/
        chart: akhq
        # Pin to a recent stable release; bump deliberately after testing.
        targetRevision: "0.28.0"
        helm:
          values: |
            # Single replica — dev/kind convenience UI, not HA.
            replicaCount: 1

            # Point AKHQ at the Strimzi plaintext bootstrap listener (:9092,
            # dev-only, no auth), so no SASL/TLS config is needed.
            configuration:
              akhq:
                connections:
                  platform-kafka:
                    properties:
                      bootstrap.servers: "platform-kafka-kafka-bootstrap.platform.svc:9092"

            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi

            service:
              type: ClusterIP
              port: 8080        # chart 0.28 key (was `httpPort` in older charts)

            # Expose via the shared Envoy Gateway (Gateway API), matching the
            # echo.* / audio.* hosts. The Gateway must allow routes from the
            # `platform` namespace (listener allowedRoutes).
            ingress:
              enabled: false
            httpRoute:
              enabled: true
              hostnames:
                - akhq.platform-core.local
              pathType: PathPrefix
              paths:
                - /
              parentRefs:
                - group: gateway.networking.k8s.io
                  kind: Gateway
                  name: platform
                  namespace: envoy-gateway-system
      destination:
        server: "{{.server}}"
        namespace: platform
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
