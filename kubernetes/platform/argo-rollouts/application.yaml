apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Install the controller before any Rollout/AnalysisTemplate is reconciled
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.43.11
    helm:
      values: |
        podSecurityContext:
          runAsNonRoot: true
          fsGroup: 10001
        controller:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          # Gateway API traffic routing (echo-service canary) via the
          # argoproj-labs/gatewayAPI plugin: the controller rewrites the
          # stable/canary backendRef weights on the echo-service HTTPRoute.
          # Replaces the built-in nginx router (ingress-nginx was retired).
          #
          # The plugin binary is per-architecture and the plugin `location` can
          # only name ONE file, so an init container downloads the build matching
          # the node (arm64 kind on Apple Silicon, amd64/arm64 on EKS) into a
          # shared emptyDir; the controller then loads it via file://.
          # Bump PLUGIN_VERSION together with Argo Rollouts (pingPong etc. need
          # Rollouts >= 1.10).
          trafficRouterPlugins:
            - name: argoproj-labs/gatewayAPI
              location: file:///plugins/gatewayapi-plugin
          initContainers:
            - name: fetch-gatewayapi-plugin
              image: curlimages/curl:8.23.0
              env:
                - name: PLUGIN_VERSION
                  value: v0.17.0
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  case "$(uname -m)" in
                    x86_64)
                      ARCH=amd64
                      SHA256=1904ca787d33107c140521899d61fff030ee75d99908bd175fca5a4647759061
                      ;;
                    aarch64|arm64)
                      ARCH=arm64
                      SHA256=5221279f7bf2c9b2c0ff6ed7ff12718ecce1d4892f1ff5e5224bb723cfd0fd92
                      ;;
                    *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
                  esac
                  curl -fsSL --retry 5 -o /plugins/gatewayapi-plugin \
                    "https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/${PLUGIN_VERSION}/gatewayapi-plugin-linux-${ARCH}"
                  echo "${SHA256}  /plugins/gatewayapi-plugin" | sha256sum -c -
                  chmod 0755 /plugins/gatewayapi-plugin
              volumeMounts:
                - name: gatewayapi-plugin
                  mountPath: /plugins
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
              securityContext:
                runAsNonRoot: true
                # curlimages/curl declares a named USER; Kubernetes cannot
                # prove runAsNonRoot without a numeric UID. fsGroup above
                # makes the shared plugin volume writable to this user.
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
          volumes:
            - name: gatewayapi-plugin
              emptyDir: {}
          volumeMounts:
            - name: gatewayapi-plugin
              mountPath: /plugins
        # Grants the controller get/list/watch/update/patch on
        # gateway.networking.k8s.io HTTPRoutes (default true; pinned explicitly
        # because the canary depends on it).
        providerRBAC:
          enabled: true
          providers:
            gatewayAPI: true
        dashboard:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # External operator CRDs can become ready after the first sync attempts.
    # Retry until they exist; the bootstrap readiness wait remains bounded.
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 60s
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
