# Envoy Gateway — the cluster's north-south entrypoint, implementing the
# Kubernetes Gateway API. Replaces ingress-nginx (retired March 2026, and the
# 4.10.x chart we ran is exposed to IngressNightmare / CVE-2025-1974 et al.).
# See docs/adr/adr-019-gateway-api-envoy-gateway.md.
#
# Three ArgoCD apps, ordered by sync-wave:
#   -3  gateway-api-crds      Gateway API CRDs (STANDARD channel) + Envoy Gateway
#                             CRDs, from the upstream gateway-crds-helm chart.
#   -2  envoy-gateway         the controller (gateway-helm, CRDs disabled so the
#                             two charts never fight over ownership).
#   -1  envoy-gateway-config  GatewayClass `envoy`, EnvoyProxy, Gateway `platform`
#                             (applicationset.yaml — dev/prod overlay selected by
#                             the cluster's `environment` label).
#
# The CRD chart version tracks the controller version: each Envoy Gateway release
# bundles (and is tested against) a specific Gateway API bundle — v1.9.x ships
# Gateway API v1.6.1. Bump both targetRevisions together.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    # OCI Helm chart: Argo CD expects the registry path WITHOUT the oci:// scheme.
    repoURL: registry-1.docker.io/envoyproxy
    chart: gateway-crds-helm
    targetRevision: v1.9.3
    helm:
      values: |
        crds:
          gatewayAPI:
            enabled: true
            # Standard channel only: GA/beta APIs (GatewayClass, Gateway,
            # HTTPRoute, GRPCRoute, ReferenceGrant, BackendTLSPolicy, ...). We do
            # not depend on any experimental-channel resource.
            channel: standard
          envoyGateway:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: false          # never auto-delete CRDs (would cascade-delete every route)
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs exceed the 256KiB last-applied-configuration annotation limit
      # of client-side apply.
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: registry-1.docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.9.3
    helm:
      # CRDs come from the gateway-api-crds app above.
      skipCrds: true
      values: |
        crds:
          enabled: false
        deployment:
          replicas: 1
          envoyGateway:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1024Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
