# Cluster-scoped. Every Gateway of class `envoy` is provisioned by Envoy Gateway
# with the data-plane settings in the referenced EnvoyProxy (per-env overlay).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: platform-proxy
    namespace: envoy-gateway-system
