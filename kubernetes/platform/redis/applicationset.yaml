# Redis — job-state store for the AI audio pipeline.
#
# Deployed to all environments (dev + prod): audio pipeline workers write
# job state (status, keys, error) under key `job:<job_id>` with a 7-day TTL,
# and audio-api reads it for the status endpoint.
#
# Service DNS: redis.platform.svc.cluster.local:6379
# Client env vars: REDIS_URL plus REDIS_PASSWORD from the redis-auth Secret.
#
# Deploys the in-repo manifest under manifests/ (a single-replica upstream
# redis:7.4-alpine Deployment + Service). We deliberately do NOT use the
# Bitnami Helm chart: Bitnami removed older image tags from Docker Hub and the
# chart names its Service `redis-master`, which breaks the contract DNS name.
# Redis requires authentication. Local bootstrap creates matching Secrets in
# platform/apps; prod materializes them from AWS Secrets Manager via ESO.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: redis
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: Exists
  template:
    metadata:
      name: redis
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/filipurminsky/platform-core.git
        targetRevision: main
        path: kubernetes/platform/redis/overlays/{{.metadata.labels.environment}}
      destination:
        server: "{{.server}}"
        namespace: platform
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
