# Single-instance Redis for the AI audio pipeline job-state store.
#
# Replaces the Bitnami Helm chart: Bitnami removed older image tags from Docker
# Hub (docker.io/bitnami/redis:<tag> now 404s) and its chart names the Service
# `redis-master`, but the pipeline contract requires `redis.platform.svc:6379`.
# A hand-rolled manifest with the upstream image pins both the image and the
# Service name.
#
# Durability: state is the source of truth for `GET /jobs/{id}` and the 7-day
# job-state TTL, so it must survive a pod reschedule. Persistence is therefore a
# StatefulSet with a PVC (not an emptyDir) and AOF enabled (appendfsync everysec)
# — a node drain / image bump no longer wipes in-flight jobs. Single replica is
# still a deliberate SPOF for a demo state store; for HA, move to a Redis
# Sentinel/cluster or managed ElastiCache.
#
# Service DNS: redis.platform.svc.cluster.local:6379
# Client env: REDIS_URL plus REDIS_PASSWORD from the redis-auth Secret.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: platform
  labels:
    app: redis
    app.kubernetes.io/part-of: platform-core
spec:
  replicas: 1
  serviceName: redis
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: platform-core
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # `redis` user in the official image
        fsGroup: 999            # make the /data PVC group-writable
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          # AOF on (durable), RDB snapshot as a periodic backstop. requirepass is
          # injected from the Secret. redis.conf is rewritten each start (cheap,
          # idempotent); the AOF/RDB data alongside it on the PVC is what persists.
          args:
            - |
              printf 'appendonly yes\nappendfsync everysec\nsave 900 1\nsave 300 10\ndir /data\nrequirepass %s\n' "$REDIS_PASSWORD" > /data/redis.conf
              exec redis-server /data/redis.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # No storageClassName: bind to the cluster default (kind: `standard`,
        # EKS: gp2/gp3). Keeps the manifest portable across dev/prod.
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: platform
  labels:
    app: redis
    app.kubernetes.io/part-of: platform-core
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Declared so node drains / Karpenter consolidation don't silently evict the
# only Redis pod with no budget. maxUnavailable: 1 still permits voluntary
# eviction (data survives on the PVC); minAvailable: 1 would block drains.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
  namespace: platform
  labels:
    app: redis
    app.kubernetes.io/part-of: platform-core
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: redis
