apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    # Keep in sync with KEDA_VERSION in .github/workflows/ci.yaml (CRD schemas).
    # 2.21 is tested on Kubernetes 1.34–1.36.
    targetRevision: 2.21.0
    helm:
      values: |
        resources:
          operator:
            requests:
              cpu: 100m
              memory: 100Mi
          metricServer:
            requests:
              cpu: 100m
              memory: 100Mi
        prometheus:
          operator:
            enabled: true
            serviceMonitor:
              enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # External operator CRDs can become ready after the first sync attempts.
    # Retry until they exist; the bootstrap readiness wait remains bounded.
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 60s
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
