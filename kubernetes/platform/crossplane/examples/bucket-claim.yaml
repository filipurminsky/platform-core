# Example self-service claim — what an app team writes to get a bucket.
#
# This file is NOT synced by ArgoCD (it lives outside the crossplane-config sync
# path and is not an Application). Apply it by hand to drive the demo:
#
#   kubectl apply -f kubernetes/platform/crossplane/examples/bucket-claim.yaml
#   kubectl -n apps get objectstoragebucket worker-artifacts -w
#   kubectl -n apps get secret worker-artifacts-conn -o yaml   # bucket, region
#
# Crossplane provisions an encrypted, private, versioned S3 bucket and writes its
# name + region into the connection secret below for the app to consume.
apiVersion: platform.io/v1alpha1
kind: ObjectStorageBucket
metadata:
  name: worker-artifacts
  namespace: apps
spec:
  parameters:
    region: eu-west-1
    versioning: true
  writeConnectionSecretToRef:
    name: worker-artifacts-conn
