# Platform S3 API. This XRD is the self-service contract: app teams create a
# namespaced `ObjectStorageBucket` (see ../examples/bucket-claim.yaml) and the
# platform-owned Composition turns it into a secure S3 bucket. Teams never touch
# raw AWS resources or IAM.
#
# Crossplane v2 model: claims are deprecated, so the composite resource (XR)
# itself is namespaced (`scope: Namespaced`) — there is no separate
# XObjectStorageBucket + claim pair any more. The XR composes namespaced managed
# resources (s3.aws.m.upbound.io) in its own namespace. XRs no longer get native
# connection secrets; function-patch-and-transform composes one (name taken
# from spec.writeConnectionSecretToRef.name, keys `bucket` and `region`) in the
# XR's namespace.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: objectstoragebuckets.platform.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  group: platform.io
  scope: Namespaced
  names:
    kind: ObjectStorageBucket
    plural: objectstoragebuckets
  defaultCompositionRef:
    name: objectstoragebucket.aws
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # v2 XRs have no built-in connection-secret field; declared here
                # so function-patch-and-transform writes the composed Secret
                # (keys: bucket, region) under this name in the XR's namespace.
                writeConnectionSecretToRef:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the Secret (in this namespace) that receives bucket + region.
                  required:
                    - name
                parameters:
                  type: object
                  properties:
                    region:
                      type: string
                      description: AWS region for the bucket.
                      default: eu-west-1
                    versioning:
                      type: boolean
                      description: Enable S3 object versioning.
                      default: true
                    audioRetentionDays:
                      type: integer
                      description: >-
                        Days after which objects under the audio/ and speech/
                        prefixes expire (raw + synthesised audio). Bounds storage
                        growth; transcripts/ and summaries/ are retained for
                        audit/replay.
                      default: 30
                    noncurrentVersionExpirationDays:
                      type: integer
                      description: >-
                        Days after which noncurrent object versions are deleted.
                        Required alongside versioning: without it, overwritten and
                        expired objects accumulate versions forever.
                      default: 7
                  required:
                    - region
              required:
                - parameters
            status:
              type: object
              properties:
                bucketName:
                  type: string
                  description: The provisioned bucket's name.
