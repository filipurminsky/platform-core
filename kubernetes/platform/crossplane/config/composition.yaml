# Composition for the platform S3 API (namespaced ObjectStorageBucket XR,
# Crossplane v2). Pipeline mode with function-patch-and-transform (the only
# composition mode in v2). Renders one secure bucket: encrypted at rest, all
# public access blocked, versioning controlled by the XR.
#
# v2 changes vs the v1/claim version:
#   - composed MRs are the NAMESPACED variants (s3.aws.m.upbound.io), created in
#     the XR's namespace, authenticated via the cluster-wide
#     ClusterProviderConfig `default` (providerconfig.yaml);
#   - single-element "blocks" are objects in the .m APIs
#     (versioningConfiguration, applyServerSideEncryptionByDefault);
#   - no writeConnectionSecretsToNamespace — function-patch-and-transform
#     composes the connection Secret (bucket, region) itself, named by the XR's
#     spec.writeConnectionSecretToRef.name, in the XR's namespace.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: objectstoragebucket.aws
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  compositeTypeRef:
    apiVersion: platform.io/v1alpha1
    kind: ObjectStorageBucket
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: bucket
            base:
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: Bucket
              spec:
                forProvider:
                  region: eu-west-1
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            connectionDetails:
              - name: bucket
                type: FromFieldPath
                fromFieldPath: metadata.annotations[crossplane.io/external-name]
              - name: region
                type: FromFieldPath
                fromFieldPath: spec.forProvider.region
            patches:
              # Deterministic AWS bucket name under the project/env prefix the
              # Crossplane + audio-pipeline IRSA policies are scoped to
              # (terraform/modules/iam: arn:aws:s3:::platform-core-prod-*).
              # Without this the bucket would be named after the generated MR
              # name (e.g. audio-pipeline-x7k2q) and every S3 call would be
              # denied. Composition is prod-only, so the env is fixed.
              # e.g. apps/audio-pipeline → platform-core-prod-apps-audio-pipeline
              # (keep namespace+name <= 44 chars: S3 names max out at 63).
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.namespace
                    - fromFieldPath: metadata.name
                  strategy: string
                  string:
                    fmt: "platform-core-prod-%s-%s"
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.annotations[crossplane.io/external-name]
                toFieldPath: status.bucketName

          - name: encryption
            base:
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: BucketServerSideEncryptionConfiguration
              spec:
                forProvider:
                  region: eu-west-1
                  bucketSelector:
                    matchControllerRef: true
                  rule:
                    - applyServerSideEncryptionByDefault:
                        sseAlgorithm: AES256
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region

          - name: public-access-block
            base:
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: BucketPublicAccessBlock
              spec:
                forProvider:
                  region: eu-west-1
                  bucketSelector:
                    matchControllerRef: true
                  blockPublicAcls: true
                  blockPublicPolicy: true
                  ignorePublicAcls: true
                  restrictPublicBuckets: true
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region

          - name: versioning
            base:
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: BucketVersioning
              spec:
                forProvider:
                  region: eu-west-1
                  bucketSelector:
                    matchControllerRef: true
                  versioningConfiguration:
                    status: Enabled
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.versioning
                toFieldPath: spec.forProvider.versioningConfiguration.status
                transforms:
                  - type: convert
                    convert:
                      toType: string
                  - type: map
                    map:
                      "true": Enabled
                      "false": Suspended

          # Lifecycle: expire raw + synthesised audio after audioRetentionDays,
          # reap noncurrent versions (versioning is on, so without this every
          # overwrite/expiry leaves a version behind forever), and abort stalled
          # multipart uploads. transcripts/ and summaries/ have no expiration —
          # only their noncurrent versions are bounded.
          - name: lifecycle
            base:
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: BucketLifecycleConfiguration
              spec:
                forProvider:
                  region: eu-west-1
                  bucketSelector:
                    matchControllerRef: true
                  rule:
                    - id: expire-audio
                      status: Enabled
                      filter:
                        - prefix: audio/
                      expiration:
                        - days: 30
                      noncurrentVersionExpiration:
                        - noncurrentDays: 7
                    - id: expire-speech
                      status: Enabled
                      filter:
                        - prefix: speech/
                      expiration:
                        - days: 30
                      noncurrentVersionExpiration:
                        - noncurrentDays: 7
                    - id: reap-noncurrent-derived
                      status: Enabled
                      filter:
                        - prefix: ""
                      noncurrentVersionExpiration:
                        - noncurrentDays: 7
                    - id: abort-incomplete-multipart
                      status: Enabled
                      filter:
                        - prefix: ""
                      abortIncompleteMultipartUpload:
                        - daysAfterInitiation: 7
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.audioRetentionDays
                toFieldPath: spec.forProvider.rule[0].expiration[0].days
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.audioRetentionDays
                toFieldPath: spec.forProvider.rule[1].expiration[0].days
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.noncurrentVersionExpirationDays
                toFieldPath: spec.forProvider.rule[0].noncurrentVersionExpiration[0].noncurrentDays
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.noncurrentVersionExpirationDays
                toFieldPath: spec.forProvider.rule[1].noncurrentVersionExpiration[0].noncurrentDays
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.noncurrentVersionExpirationDays
                toFieldPath: spec.forProvider.rule[2].noncurrentVersionExpiration[0].noncurrentDays
