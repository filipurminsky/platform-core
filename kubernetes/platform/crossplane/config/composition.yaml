# Composition for the platform S3 API (XObjectStorageBucket). Pipeline mode with
# function-patch-and-transform (the current Crossplane pattern; native inline
# patch-and-transform is deprecated). Renders one secure bucket: encrypted at
# rest, all public access blocked, versioning controlled by the claim.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: objectstoragebucket.aws
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  compositeTypeRef:
    apiVersion: platform.io/v1alpha1
    kind: XObjectStorageBucket
  writeConnectionSecretsToNamespace: crossplane-system
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: bucket
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: Bucket
              spec:
                forProvider:
                  region: eu-west-1
                providerConfigRef:
                  name: default
            connectionDetails:
              - name: bucket
                type: FromFieldPath
                fromFieldPath: metadata.annotations[crossplane.io/external-name]
              - name: region
                type: FromFieldPath
                fromFieldPath: spec.forProvider.region
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.annotations[crossplane.io/external-name]
                toFieldPath: status.bucketName

          - name: encryption
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: BucketServerSideEncryptionConfiguration
              spec:
                forProvider:
                  region: eu-west-1
                  bucketSelector:
                    matchControllerRef: true
                  rule:
                    - applyServerSideEncryptionByDefault:
                        - sseAlgorithm: AES256
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region

          - name: public-access-block
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: BucketPublicAccessBlock
              spec:
                forProvider:
                  region: eu-west-1
                  bucketSelector:
                    matchControllerRef: true
                  blockPublicAcls: true
                  blockPublicPolicy: true
                  ignorePublicAcls: true
                  restrictPublicBuckets: true
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region

          - name: versioning
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: BucketVersioning
              spec:
                forProvider:
                  region: eu-west-1
                  bucketSelector:
                    matchControllerRef: true
                  versioningConfiguration:
                    - status: Enabled
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.versioning
                toFieldPath: spec.forProvider.versioningConfiguration[0].status
                transforms:
                  - type: convert
                    convert:
                      toType: string
                  - type: map
                    map:
                      "true": Enabled
                      "false": Suspended

          # Lifecycle: expire raw + synthesised audio after audioRetentionDays,
          # reap noncurrent versions (versioning is on, so without this every
          # overwrite/expiry leaves a version behind forever), and abort stalled
          # multipart uploads. transcripts/ and summaries/ have no expiration —
          # only their noncurrent versions are bounded.
          - name: lifecycle
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: BucketLifecycleConfiguration
              spec:
                forProvider:
                  region: eu-west-1
                  bucketSelector:
                    matchControllerRef: true
                  rule:
                    - id: expire-audio
                      status: Enabled
                      filter:
                        - prefix: audio/
                      expiration:
                        - days: 30
                      noncurrentVersionExpiration:
                        - noncurrentDays: 7
                    - id: expire-speech
                      status: Enabled
                      filter:
                        - prefix: speech/
                      expiration:
                        - days: 30
                      noncurrentVersionExpiration:
                        - noncurrentDays: 7
                    - id: reap-noncurrent-derived
                      status: Enabled
                      filter:
                        - prefix: ""
                      noncurrentVersionExpiration:
                        - noncurrentDays: 7
                    - id: abort-incomplete-multipart
                      status: Enabled
                      filter:
                        - prefix: ""
                      abortIncompleteMultipartUpload:
                        - daysAfterInitiation: 7
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.audioRetentionDays
                toFieldPath: spec.forProvider.rule[0].expiration[0].days
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.audioRetentionDays
                toFieldPath: spec.forProvider.rule[1].expiration[0].days
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.noncurrentVersionExpirationDays
                toFieldPath: spec.forProvider.rule[0].noncurrentVersionExpiration[0].noncurrentDays
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.noncurrentVersionExpirationDays
                toFieldPath: spec.forProvider.rule[1].noncurrentVersionExpiration[0].noncurrentDays
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.noncurrentVersionExpirationDays
                toFieldPath: spec.forProvider.rule[2].noncurrentVersionExpiration[0].noncurrentDays
