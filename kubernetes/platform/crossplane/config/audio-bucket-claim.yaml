# Audio pipeline S3 bucket claim (prod only).
#
# Crossplane provisions a secure, versioned S3 bucket named `audio-pipeline`
# in eu-west-1. The connection secret written to `audio-pipeline-conn` in the
# `apps` namespace exposes `bucket` and `region` keys consumed by the workers
# (S3_BUCKET env var) via ExternalSecret or direct Secret mount.
#
# Lifecycle: the Composition attaches a BucketLifecycleConfiguration driven by
# the parameters below —
#   audio/<job_id>, speech/<job_id>          — expire after audioRetentionDays (30)
#   transcripts/<job_id>, summaries/<job_id> — retained (audit/replay); only their
#                                              noncurrent versions are reaped
#   all prefixes                             — noncurrent versions deleted after
#                                              noncurrentVersionExpirationDays (7),
#                                              incomplete multipart uploads aborted
# This bounds storage cost despite versioning being enabled.
apiVersion: platform.io/v1alpha1
kind: ObjectStorageBucket
metadata:
  name: audio-pipeline
  namespace: apps
spec:
  parameters:
    region: eu-west-1
    versioning: true
    audioRetentionDays: 30
    noncurrentVersionExpirationDays: 7
  writeConnectionSecretToRef:
    name: audio-pipeline-conn
