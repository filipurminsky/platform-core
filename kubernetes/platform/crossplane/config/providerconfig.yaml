# Tells the AWS provider how to authenticate. `source: IRSA` makes it use the
# pod's web-identity token (the IRSA role on the provider-aws-s3 ServiceAccount)
# — no access keys anywhere, consistent with the rest of the platform.
#
# Crossplane v2: the namespaced managed resources (s3.aws.m.upbound.io) composed
# by the namespaced ObjectStorageBucket XR reference a provider config by kind.
# A single cluster-scoped ClusterProviderConfig (aws.m.upbound.io) serves every
# namespace; the Composition sets providerConfigRef {kind: ClusterProviderConfig,
# name: default}. (The legacy cluster-scoped aws.upbound.io ProviderConfig is no
# longer needed — nothing composes the legacy s3.aws.upbound.io kinds.)
#
# Synced at a later wave: the aws.m.upbound.io CRDs only exist once the Provider
# package (and its provider-family-aws dependency) has installed and become Healthy.
apiVersion: aws.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  credentials:
    source: IRSA
