apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # v2.x (upgraded from 0.9.18). external-secrets.io/v1 is the storage
    # version; v1beta1 is still served but deprecated — all CRs in this repo
    # use v1. v2.0 only removed the Alibaba/Device42 providers (unused here).
    targetRevision: 2.14.0
    helm:
      values: |
        installCRDs: true
        serviceAccount:
          annotations:
            # IRSA — role ARN injected by Terraform output
            eks.amazonaws.com/role-arn: ""   # set via ArgoCD ApplicationSet parameter
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
