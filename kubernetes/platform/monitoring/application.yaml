apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # CRDs (ServiceMonitor, PrometheusRule) must exist before app workloads sync
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 58.2.1
    helm:
      values: |
        fullnameOverride: kube-prometheus-stack
        prometheus:
          prometheusSpec:
            # Discover ALL ServiceMonitors/PrometheusRules regardless of label,
            # so the repo's existing manifests (mixed labels) are picked up.
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            retention: 6h
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 1Gi
        grafana:
          fullnameOverride: grafana   # bootstrap.sh port-forwards svc/grafana
          adminPassword: admin
          defaultDashboardsEnabled: true
          # Discover dashboard ConfigMaps (labelled grafana_dashboard) from any
          # namespace — the platform-core dashboards ship via the
          # grafana-dashboards Application as labelled ConfigMaps in `monitoring`.
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
              folderAnnotation: grafana_folder
              provider:
                foldersFromFilesStructure: true
            datasources:
              enabled: true
          # Loki (logs) and Tempo (traces) are deployed by their own Applications
          # in this namespace; wire both so Grafana covers the full metrics + logs
          # + traces (Prometheus, Loki, Tempo) story. The Tempo datasource links
          # spans back to Loki logs (tracesToLogsV2) and Prometheus metrics, and a
          # derived field on Loki turns the trace_id JSON log field into a clickable
          # Tempo link.
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              isDefault: false
              jsonData:
                maxLines: 1000
                derivedFields:
                  - name: trace_id
                    matcherRegex: '"trace_id":"(\w+)"'
                    datasourceUid: tempo
                    url: "$${__value.raw}"
            - name: Tempo
              type: tempo
              uid: tempo
              access: proxy
              url: http://tempo.monitoring.svc.cluster.local:3200
              isDefault: false
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                  filterByTraceID: true
                  spanStartTimeShift: "-5m"
                  spanEndTimeShift: "5m"
                tracesToMetrics:
                  datasourceUid: prometheus
                serviceMap:
                  datasourceUid: prometheus
                nodeGraph:
                  enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
        alertmanager:
          enabled: false              # not needed for local dev
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
        kube-state-metrics:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
          # kube-state-metrics v2 does not expose arbitrary node labels by
          # default — without this allowlist, kube_node_labels{label_role=...}
          # has no series and the GpuNodeUnavailable alert's `unless` clause is
          # vacuously empty (the alert would fire whenever vLLM has replicas).
          metricLabelsAllowlist:
            - nodes=[role]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
