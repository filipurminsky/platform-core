apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # CRDs (ServiceMonitor, PrometheusRule) must exist before app workloads sync
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    # 92.20.0 (Prometheus Operator v0.94.2, Prometheus v3, Grafana chart 14 / Grafana 13,
    # now sourced from grafana-community). Upgraded from 58.2.1. Notes:
    #   - CRDs: the chart's CRDs are large (>256KiB annotation limit), so they
    #     MUST be applied server-side — keep ServerSideApply=true below. ArgoCD
    #     upgrades the CRDs from the chart's crds/ dir on every sync, so the
    #     manual `kubectl apply --server-side` step in UPGRADE.md is not needed.
    #   - `*SelectorNilUsesHelmValues` is deprecated (62→63): empty selectors are
    #     now `<x>Selector.matchLabels: {}` (null fails the v0.95.1 CRD schema).
    #   - Prometheus v3: PromQL `.` in regexes now matches newlines and range
    #     selectors are left-open — review recording/alert rules accordingly.
    #   - Grafana 13 image is distroless with readOnlyRootFilesystem; no
    #     GF_*__FILE env vars (none used here).
    # v0.95.1 operator/reloader image indexes omit ARM64 (verified 2026-11-09).
    # Keep controller, reloader and CRDs on the last verified multi-arch chart.
    # See docs/tool-upgrades.md before removing this compatibility hold.
    targetRevision: 92.20.0
    helm:
      values: |
        fullnameOverride: kube-prometheus-stack
        prometheus:
          prometheusSpec:
            # Discover ALL ServiceMonitors/PrometheusRules regardless of label,
            # so the repo's existing manifests (mixed labels) are picked up.
            serviceMonitorSelector:
              matchLabels: {}
            ruleSelector:
              matchLabels: {}
            podMonitorSelector:
              matchLabels: {}
            retention: 6h
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 1Gi
        grafana:
          fullnameOverride: grafana   # bootstrap.sh port-forwards svc/grafana
          adminPassword: admin
          defaultDashboardsEnabled: true
          # Discover dashboard ConfigMaps (labelled grafana_dashboard) from any
          # namespace — the platform-core dashboards ship via the
          # grafana-dashboards Application as labelled ConfigMaps in `monitoring`.
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
              folderAnnotation: grafana_folder
              provider:
                foldersFromFilesStructure: true
            datasources:
              enabled: true
              # Alertmanager is disabled below — don't provision a dead datasource.
              alertmanager:
                enabled: false
          # No Ingress (ingress-nginx was replaced by Envoy Gateway; the chart's
          # ingress is disabled by default). Grafana is exposed through a Gateway
          # API HTTPRoute attached to the shared `platform` Gateway. The
          # sync-option lets the app sync even if the Gateway API CRDs land
          # slightly later (the retry in syncPolicy below converges once they exist).
          route:
            main:
              enabled: true
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              annotations:
                argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
              hostnames:
                - grafana.platform-core.local
              parentRefs:
                - name: platform
                  namespace: envoy-gateway-system
          # Loki (logs) and Tempo (traces) are deployed by their own Applications
          # in this namespace (Loki = grafana-community/loki single-binary, Service
          # `loki:3100`; logs shipped by Grafana Alloy, see kubernetes/platform/alloy); wire both so Grafana covers the full metrics + logs
          # + traces (Prometheus, Loki, Tempo) story. The Tempo datasource links
          # spans back to Loki logs (tracesToLogsV2) and Prometheus metrics, and a
          # derived field on Loki turns the trace_id JSON log field into a clickable
          # Tempo link.
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              isDefault: false
              jsonData:
                maxLines: 1000
                derivedFields:
                  # structlog's JSONRenderer emits `"trace_id": "<hex>"` (json.dumps
                  # default separators put a space after the colon), so allow
                  # optional whitespace — the old `"trace_id":"(\w+)"` never matched.
                  - name: trace_id
                    matcherRegex: '"trace_id":\s*"(\w+)"'
                    datasourceUid: tempo
                    url: "$${__value.raw}"
            - name: Tempo
              type: tempo
              uid: tempo
              access: proxy
              url: http://tempo.monitoring.svc.cluster.local:3200
              isDefault: false
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                  filterByTraceID: true
                  spanStartTimeShift: "-5m"
                  spanEndTimeShift: "5m"
                tracesToMetrics:
                  datasourceUid: prometheus
                serviceMap:
                  datasourceUid: prometheus
                nodeGraph:
                  enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
        alertmanager:
          enabled: false              # not needed for local dev
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
        kube-state-metrics:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
          # kube-state-metrics v2 does not expose arbitrary node labels by
          # default — without this allowlist, kube_node_labels{label_role=...}
          # has no series and the GpuNodeUnavailable alert's `unless` clause is
          # vacuously empty (the alert would fire whenever vLLM has replicas).
          metricLabelsAllowlist:
            - nodes=[role]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Retry so a first sync that races the Gateway API CRDs (HTTPRoute) or the
    # CRD establishment converges without manual intervention.
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
