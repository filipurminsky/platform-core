# Shared EC2NodeClass — how Karpenter launches EC2 instances. Subnets and the
# node security group are discovered via the karpenter.sh/discovery tag stamped
# by Terraform (networking + eks modules). AL2 resolves to the GPU-optimized AMI
# automatically for GPU instance types, so one node class serves both NodePools.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2
  amiSelectorTerms:
    - alias: al2@latest
  # `terraform output karpenter_node_iam_role_name`
  role: <KARPENTER_NODE_IAM_ROLE>
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: platform-core-prod
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: platform-core-prod
  tags:
    karpenter.sh/discovery: platform-core-prod
    ManagedBy: karpenter
