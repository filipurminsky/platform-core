apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Controller + CRDs must exist before any ClusterPolicy is applied
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    # 3.9.x = Kyverno v1.19 (upgraded from 3.2.6 / v1.12). Ships the
    # policies.kyverno.io CEL policy CRDs (ValidatingPolicy,
    # ImageValidatingPolicy, …) via the kyverno-api subchart; the repo's
    # policies (kyverno-policies/) were migrated off the deprecated
    # kyverno.io/v1 ClusterPolicy, which is scheduled for removal in v1.20.
    # Note: policies.kyverno.io storage version is still v1beta1 in 1.19 — run
    # `kyverno migrate` after the 1.20 upgrade.
    targetRevision: 3.9.2
    helm:
      values: |
        admissionController:
          replicas: 1
        backgroundController:
          enabled: true
        reportsController:
          enabled: true
        policyReportsCleanup:
          enabled: false
        webhooksCleanup:
          enabled: false
        cleanupController:
          enabled: false
        cleanupJobs:
          admissionReports:
            enabled: false
          clusterAdmissionReports:
            enabled: false
          updateRequests:
            enabled: false
          ephemeralReports:
            enabled: false
          clusterEphemeralReports:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
