# Cluster-wide AWS Secrets Manager store. ExternalSecrets reference it via
# secretStoreRef {kind: ClusterSecretStore, name: aws-secrets-manager}.
# Auth: the operator's ServiceAccount carries the IRSA role
# (terraform/modules/iam → irsa_external_secrets), whose policy is scoped to
# secrets under <project>/<environment>/* — keep Secrets Manager paths on that
# convention (e.g. platform-core/prod/audio-api).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
