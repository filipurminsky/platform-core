apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Deploy after CRDs / monitoring stack so Grafana can pick up the datasource.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    # The OSS Loki chart moved to the community-maintained repo (grafana/loki
    # 7.x+ is Grafana Enterprise Logs only). This replaces the deprecated
    # `loki-stack` chart (2.10.2, Loki 2.x + Promtail). Promtail reached EOL in
    # early 2026; log collection now runs in Grafana Alloy
    # (kubernetes/platform/alloy), which pushes to this Loki.
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 21.0.0          # Loki 3.7.9
    helm:
      # Monolithic (single-binary) Loki with local filesystem storage — fine for
      # local/dev (ephemeral, 24h retention). Grafana and Prometheus come from the
      # kube-prometheus-stack `monitoring` Application; the Loki datasource
      # (uid `loki`, http://loki.monitoring.svc.cluster.local:3100) and the
      # trace_id → Tempo derived field are wired in the monitoring values.
      #
      # PROD NOTE: filesystem storage on a single replica is not durable. For a
      # real prod deployment switch `loki.storage.type: s3` with
      # bucketNames.{chunks,ruler,admin} on a Crossplane-provisioned bucket (IRSA
      # on serviceAccount), raise replication / move to Distributed mode, and
      # re-enable the memcached chunks/results caches.
      values: |
        fullnameOverride: loki
        deploymentMode: Monolithic
        loki:
          auth_enabled: false          # single tenant ("fake"); Alloy sends no X-Scope-OrgID
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            retention_period: 24h
            allow_structured_metadata: true
            volume_enabled: true
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
          pattern_ingester:
            enabled: false
          # Loki's own UI is not needed — Grafana is the single pane.
          ui:
            enabled: false
        singleBinary:
          replicas: 1
          # Ephemeral in dev (matches the old loki-stack persistence: false);
          # with persistence off the chart mounts an emptyDir at /var/loki.
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
        # Scalable / distributed targets are unused in Monolithic mode.
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        # Grafana talks to the loki Service directly — no nginx gateway needed.
        gateway:
          enabled: false
        # Memcached caches are overkill for a 1-replica dev Loki.
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
        # Scrape Loki's own metrics (the loki-alerts PrometheusRule in
        # observability/loki uses loki_request_duration_seconds).
        monitoring:
          serviceMonitor:
            enabled: true
          selfMonitoring:
            enabled: false
          dashboards:
            enabled: false
          rules:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # External operator CRDs can become ready after the first sync attempts.
    # Retry until they exist; the bootstrap readiness wait remains bounded.
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 60s
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
