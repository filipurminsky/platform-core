apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Create/label shared namespaces before any app or platform workload syncs, so
    # Pod Security Admission labels are present when the first pod is admitted.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: https://github.com/filipurminsky/platform-core.git
    targetRevision: main
    path: kubernetes/platform/namespaces/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
