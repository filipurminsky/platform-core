apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: echo-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-apps            # governed promotion (sync window) — see kubernetes/platform/argocd/appproject-apps.yaml
  source:
    repoURL: https://github.com/filipurminsky/platform-core.git
    targetRevision: main
    path: kustomize/overlays/dev    # change to overlays/prod for production
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  ignoreDifferences:
    # Argo Rollouts injects rollouts-pod-template-hash into these Service
    # selectors at runtime to steer stable/canary traffic.
    - kind: Service
      name: echo-service
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
    - kind: Service
      name: echo-service-canary
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
