# TriggerAuthentication — wires the Strimzi-generated SCRAM password into KEDA.
# The effective GitOps-managed copy lives in the prod worker kustomize overlay.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: kafka-trigger-auth
  namespace: apps
spec:
  secretTargetRef:
    - parameter: password
      name: worker-service         # Strimzi-generated secret name = KafkaUser name
      key: password
