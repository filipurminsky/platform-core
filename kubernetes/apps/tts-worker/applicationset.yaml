# Environment-selected via the cluster generator (see worker-service for details):
# the destination cluster's `environment` label drives the overlay path.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tts-worker
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: Exists
  template:
    metadata:
      name: tts-worker
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-apps
      # KEDA owns /spec/replicas (scale-from-zero); exclude it from sync so
      # selfHeal does not revert KEDA's scale-up back to the git value (0).
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      source:
        repoURL: https://github.com/filipurminsky/platform-core.git
        targetRevision: main
        path: services/tts-worker/k8s/overlays/{{.metadata.labels.environment}}
      destination:
        server: "{{.server}}"
        namespace: apps
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          # ignoreDifferences only affects the DIFF; without this option a
          # sync still applies the git value over the ignored field (e.g.
          # KEDA-managed replicas reset to 0, or Argo Rollouts' injected
          # canary Service selector wiped).
          - RespectIgnoreDifferences=true
