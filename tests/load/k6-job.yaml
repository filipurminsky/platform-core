apiVersion: batch/v1
kind: Job
metadata:
  name: k6-echo-load
  labels:
    app: k6-load
    app.kubernetes.io/part-of: platform-core
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: k6-load
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345        # the k6 image's built-in non-root user
        runAsGroup: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:0.49.0
          args: ["run", "/scripts/echo-load.js"]
          env:
            # Drive traffic THROUGH the Envoy Gateway (its stable Service name
            # comes from the EnvoyProxy, kubernetes/platform/envoy-gateway), with
            # the echo HTTPRoute's hostname. Hitting the echo-service ClusterIP
            # directly would bypass the canary split entirely: during a rollout
            # Argo Rollouts pins that Service's selector to the STABLE pods, so
            # the canary would get zero traffic and the canary-metrics-present
            # analysis check would abort every good rollout.
            - name: TARGET
              value: http://envoy-platform.envoy-gateway-system.svc.cluster.local
            - name: HOST
              value: echo.platform-core.local
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: k6-echo-script
        - name: tmp
          emptyDir: {}
