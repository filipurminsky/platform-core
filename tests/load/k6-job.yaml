apiVersion: batch/v1
kind: Job
metadata:
  name: k6-echo-load
  labels:
    app: k6-load
    app.kubernetes.io/part-of: platform-core
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: k6-load
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.49.0
          args: ["run", "/scripts/echo-load.js"]
          env:
            # Drive the in-cluster stable Service so traffic flows through the
            # canary split managed by Argo Rollouts + nginx.
            - name: TARGET
              value: http://echo-service.apps.svc.cluster.local
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: k6-echo-script
        - name: tmp
          emptyDir: {}
