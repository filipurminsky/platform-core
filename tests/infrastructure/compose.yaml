# Isolated acceptance fixture: no fixed container names, host ports, or external
# volumes. scripts/test-infrastructure.sh supplies a unique project and secrets.
services:
  kafka:
    image: confluentinc/cp-kafka:8.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: [CMD, kafka-topics, --bootstrap-server, localhost:9092, --list]
      interval: 5s
      timeout: 5s
      retries: 36
  redis:
    image: redis:7.4.12-alpine
    environment:
      TEST_REDIS_PASSWORD: ${TEST_REDIS_PASSWORD:?runner supplies ephemeral credentials}
    command: [sh, -c, 'exec redis-server --dir /data --save 900 1 --save 300 10 --appendonly yes --appendfsync everysec --requirepass "$$TEST_REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$TEST_REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30
  redis-restore:
    profiles: [recovery]
    image: redis:7.4.12-alpine
    environment:
      TEST_REDIS_PASSWORD: ${TEST_REDIS_PASSWORD:?runner supplies ephemeral credentials}
    # Redis must load RDB with AOF initially disabled, then the verifier enables
    # AOF and waits for its rewrite. Starting with AOF enabled skips the RDB.
    command: [sh, -c, 'mode=yes; if [ ! -d /data/appendonlydir ]; then cp /backup/redis-backup.rdb /data/dump.rdb; mode=no; fi; exec redis-server --dir /data --save 900 1 --save 300 10 --appendonly "$$mode" --appendfsync everysec --requirepass "$$TEST_REDIS_PASSWORD"']
    volumes:
      - redis-restore-data:/data
      - ${INFRA_EVIDENCE_DIR:?runner supplies evidence directory}:/backup:ro
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$TEST_REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30
  objectstore:
    image: chrislusf/seaweedfs:4.53
    command: [server, -ip=objectstore, -ip.bind=0.0.0.0, -dir=/data, -s3, -s3.port=9000, -s3.config=/etc/seaweedfs/s3.json]
    configs:
      - source: s3-credentials
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:9000/healthz]
      interval: 2s
      timeout: 3s
      retries: 60
  tests:
    build:
      context: ../../services
      dockerfile: ../tests/infrastructure/Dockerfile
    environment:
      OTEL_SDK_DISABLED: "true"
      STT_BACKEND: stub
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${TEST_REDIS_PASSWORD:?runner supplies ephemeral credentials}
      S3_ENDPOINT_URL: http://objectstore:9000
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${TEST_S3_ACCESS_KEY:?runner supplies ephemeral credentials}
      AWS_SECRET_ACCESS_KEY: ${TEST_S3_SECRET_KEY:?runner supplies ephemeral credentials}
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - .:/tests:ro
      - ${INFRA_EVIDENCE_DIR:?runner supplies evidence directory}:/evidence
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  redis-data:
  redis-restore-data:
configs:
  s3-credentials:
    content: |
      {"identities":[{"name":"acceptance","credentials":[{"accessKey":"${TEST_S3_ACCESS_KEY}","secretKey":"${TEST_S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
