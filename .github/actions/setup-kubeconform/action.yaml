name: Set up kubeconform + CRD schemas
description: >-
  Installs a checksum-verified kubeconform, converts the platform's CRDs
  (Strimzi, KEDA, Gateway API, Envoy Gateway, External Secrets, Argo Rollouts) into local
  JSON schemas, and installs a `kubeconform-k8s` wrapper that always validates
  against the fleet Kubernetes version with the full schema-location chain.
  Usage after this step:  <manifests> | kubeconform-k8s [extra kubeconform args] [paths]

inputs:
  kubernetes-version:
    description: Kubernetes version to validate against (fleet target)
    required: true
  strimzi-version:
    description: Strimzi release (no leading v), e.g. 0.40.0
    required: true
  keda-version:
    description: KEDA release (no leading v), e.g. 2.13.0
    required: true
  gateway-api-version:
    description: Gateway API release tag, e.g. v1.6.3
    required: true
  envoy-gateway-version:
    description: Envoy Gateway release tag, e.g. v1.10.0
    required: true
  external-secrets-version:
    description: External Secrets Operator release tag, e.g. v2.14.0
    required: true
  argo-rollouts-version:
    description: Argo Rollouts release tag, e.g. v1.10.2 (Rollout/AnalysisTemplate CRDs)
    required: true
  kubeconform-version:
    description: kubeconform release tag
    default: v0.8.0
  kubeconform-sha256:
    description: sha256 of kubeconform-linux-amd64.tar.gz (from the release CHECKSUMS file)
    default: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

runs:
  using: composite
  steps:
    - name: Install kubeconform (checksum-verified)
      shell: bash
      env:
        KC_VERSION: ${{ inputs.kubeconform-version }}
        KC_SHA256: ${{ inputs.kubeconform-sha256 }}
      run: |
        set -euo pipefail
        tmp="$(mktemp -d)"
        curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KC_VERSION}/kubeconform-linux-amd64.tar.gz" -o "$tmp/kubeconform.tar.gz"
        # Verify integrity before trusting the binary that gates manifests. A
        # version bump fails here until the sum is updated (which is the point).
        echo "${KC_SHA256}  $tmp/kubeconform.tar.gz" | sha256sum -c -
        tar -xzf "$tmp/kubeconform.tar.gz" -C "$tmp" kubeconform
        sudo install -m 0755 "$tmp/kubeconform" /usr/local/bin/kubeconform

    - name: Download CRDs + convert to JSON schemas
      shell: bash
      env:
        STRIMZI_VERSION: ${{ inputs.strimzi-version }}
        KEDA_VERSION: ${{ inputs.keda-version }}
        GATEWAY_API_VERSION: ${{ inputs.gateway-api-version }}
        ENVOY_GATEWAY_VERSION: ${{ inputs.envoy-gateway-version }}
        EXTERNAL_SECRETS_VERSION: ${{ inputs.external-secrets-version }}
        ROLLOUTS_VERSION: ${{ inputs.argo-rollouts-version }}
      run: |
        set -euo pipefail
        src=/tmp/crd-src
        mkdir -p "$src" /tmp/crd-schemas
        fetch() { curl -sSfL "$1" -o "$src/$2"; }
        fetch "https://github.com/strimzi/strimzi-kafka-operator/releases/download/${STRIMZI_VERSION}/strimzi-crds-${STRIMZI_VERSION}.yaml" strimzi.yaml
        fetch "https://github.com/kedacore/keda/releases/download/v${KEDA_VERSION}/keda-${KEDA_VERSION}-crds.yaml" keda.yaml
        # Gateway API standard channel (Gateway, GatewayClass, HTTPRoute, GRPCRoute, ReferenceGrant).
        fetch "https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml" gateway-api.yaml
        # Envoy Gateway extension CRDs (EnvoyProxy, *TrafficPolicy, SecurityPolicy, …).
        fetch "https://github.com/envoyproxy/gateway/releases/download/${ENVOY_GATEWAY_VERSION}/envoy-gateway-crds.yaml" envoy-gateway.yaml
        # ESO release manifest (CRDs + controller); the converter keeps only CRDs
        # → external-secrets.io/v1 ExternalSecret/ClusterSecretStore/…
        fetch "https://github.com/external-secrets/external-secrets/releases/download/${EXTERNAL_SECRETS_VERSION}/external-secrets.yaml" external-secrets.yaml
        # Argo Rollouts install manifest (CRDs + controller) → argoproj.io
        # Rollout (incl. trafficRouting.plugins), AnalysisTemplate, AnalysisRun.
        fetch "https://github.com/argoproj/argo-rollouts/releases/download/${ROLLOUTS_VERSION}/install.yaml" argo-rollouts.yaml
        python3 "${GITHUB_ACTION_PATH}/../../scripts/crd-to-jsonschema.py" /tmp/crd-schemas "$src"/*.yaml

    - name: Install kubeconform-k8s wrapper
      shell: bash
      env:
        K8S_VERSION: ${{ inputs.kubernetes-version }}
      run: |
        set -euo pipefail
        # Schema resolution order: built-in k8s (pinned version, strict) → our
        # converted CRDs → datree CRDs-catalog → kubernetes-schemas.pages.dev.
        sudo tee /usr/local/bin/kubeconform-k8s >/dev/null <<EOF
        #!/usr/bin/env bash
        exec kubeconform -strict -summary \\
          -kubernetes-version '${K8S_VERSION}' \\
          -schema-location default \\
          -schema-location '/tmp/crd-schemas/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \\
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \\
          -schema-location 'https://kubernetes-schemas.pages.dev/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \\
          "\$@"
        EOF
        sudo chmod 0755 /usr/local/bin/kubeconform-k8s
        kubeconform -v
