name: Test apps (reusable)

# Called by ci.yaml (on every PR/push) and docker-build.yaml (before building
# a new image). Extracting into a reusable workflow avoids running the pytest
# matrix twice on every push to main that touches services/.
# services/platform-common is the shared worker library (Kafka I/O, retry/DLQ,
# observability, …) consumed by the four Kafka workers — tested here too.
on:
  workflow_call: {}

# Callers grant contents: read; never ask for more here.
permissions:
  contents: read

jobs:
  app-test:
    name: Python tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [platform-common, echo-service, worker-service, llm-gateway, audio-api, stt-worker, tts-worker, llm-worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "services/${{ matrix.app }}/uv.lock"

      - name: Install deps (runtime + test) from lockfile
        working-directory: services/${{ matrix.app }}
        run: uv sync --frozen

      - name: Run pytest
        working-directory: services/${{ matrix.app }}
        run: uv run --frozen pytest -q
