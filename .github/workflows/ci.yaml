name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  STRIMZI_VERSION: "0.40.0"
  KEDA_VERSION: "2.13.0"

jobs:
  helm-lint:
    name: Helm lint + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.14.0"

      - name: Set up kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz && sudo mv kubeconform /usr/local/bin/

      - name: Download Strimzi + KEDA CRD schemas
        run: |
          mkdir -p /tmp/crd-schemas/strimzi /tmp/crd-schemas/keda
          # Strimzi CRDs → kubeconform schema format
          curl -sSL "https://github.com/strimzi/strimzi-kafka-operator/releases/download/${STRIMZI_VERSION}/strimzi-crds-${STRIMZI_VERSION}.yaml" \
            -o /tmp/crd-schemas/strimzi/crds.yaml
          curl -sSL "https://github.com/kedacore/keda/releases/download/v${KEDA_VERSION}/keda-${KEDA_VERSION}-crds.yaml" \
            -o /tmp/crd-schemas/keda/crds.yaml

      - name: Helm lint all charts
        run: |
          for chart in helm/*/; do
            echo "==> Linting $chart"
            helm lint "$chart"
          done

      - name: Helm template + kubeconform (demo-app)
        run: |
          helm template demo helm/demo-app \
            | kubeconform -strict -summary \
              -schema-location default \
              -schema-location '/tmp/crd-schemas/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -schema-location 'https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      - name: Helm template + kubeconform (vllm)
        run: |
          helm template vllm helm/vllm \
            | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -schema-location 'https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  kustomize-validate:
    name: Kustomize build + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- /tmp
          sudo mv /tmp/kustomize /usr/local/bin/

      - name: Set up kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz && sudo mv kubeconform /usr/local/bin/

      - name: Build + validate dev overlay
        run: |
          kustomize build kustomize/overlays/dev \
            | kubeconform -strict -summary -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -schema-location 'https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      - name: Build + validate dev app overlays
        run: |
          for overlay in kustomize/overlays/dev/*/; do
            kustomize build "$overlay" \
              | kubeconform -strict -summary -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -schema-location 'https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

      - name: Build + validate prod overlay
        run: |
          kustomize build kustomize/overlays/prod \
            | kubeconform -strict -summary -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -schema-location 'https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      - name: Build + validate prod app overlays
        run: |
          for overlay in kustomize/overlays/prod/*/; do
            kustomize build "$overlay" \
              | kubeconform -strict -summary -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -schema-location 'https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  kube-linter:
    name: kube-linter best-practice checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run kube-linter on kubernetes/
        uses: stackrox/kube-linter-action@v1
        with:
          directory: kubernetes/
          config: .kube-linter.yaml
          # Pin the binary — `latest` renames/adds checks and breaks the config.
          version: v0.8.3

  opa-policies:
    name: OPA / conftest policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up conftest
        run: |
          # conftest release assets embed the version in the filename
          # (conftest_<ver>_Linux_x86_64.tar.gz), so the version-less
          # /latest/download/ URL 404s. Pin an explicit version instead.
          CONFTEST_VERSION=0.56.0
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz && sudo mv conftest /usr/local/bin/

      - name: Set up kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- /tmp
          sudo mv /tmp/kustomize /usr/local/bin/

      - name: Run OPA policies (dev overlay)
        run: |
          kustomize build kustomize/overlays/dev \
            | conftest test --policy policy/ -

      - name: Run OPA policies (prod overlay)
        run: |
          kustomize build kustomize/overlays/prod \
            | conftest test --policy policy/ -

  terraform-validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform validate (dev)
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform validate (prod)
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend=false
          terraform validate

  app-lint:
    name: Python lint (apps)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [echo-service, worker-service, llm-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/${{ matrix.app }}/requirements.txt

      - name: Install deps + ruff
        run: |
          pip install ruff
          pip install -r apps/${{ matrix.app }}/requirements.txt

      - name: Ruff lint
        run: ruff check apps/${{ matrix.app }}/main.py

      - name: Ruff format check
        run: ruff format --check apps/${{ matrix.app }}/main.py

  app-build:
    name: Docker build (apps)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [echo-service, worker-service, llm-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: apps/${{ matrix.app }}
          push: false
          tags: platform-core/${{ matrix.app }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  checkov:
    name: Checkov security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          output_format: cli
          # CKV_TF_1 wants module sources pinned to a git commit hash. Our modules
          # come from the Terraform Registry pinned with semver (~> X.0); commit-hash
          # pinning is not applicable to registry sources, and CKV_TF_2 (version tag
          # present) already passes. Skip only this one check.
          skip_check: CKV_TF_1

  trivy-iac:
    name: Trivy IaC + Dockerfile misconfig scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches misconfigurations across Terraform, Kubernetes manifests and
      # Dockerfiles (privileged pods, missing securityContext, broad IAM, etc.)
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.20.0
        # Reviewed, justified exceptions (third-party module / false positive /
        # intentional design) live in .trivyignore.yaml. We point Trivy at it via
        # TRIVY_IGNOREFILE rather than the action's `trivyignores` input: that
        # input cats the file into an extension-less `./trivyignores`, which Trivy
        # then parses with the *plain* (one-id-per-line) parser, silently dropping
        # the YAML structure and all path scoping. The env var preserves the .yaml
        # extension so the structured, path-scoped parser is used.
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
          skip-dirs: ".github"

  kubernetes-validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz && sudo mv kubeconform /usr/local/bin/

      - name: Validate all manifests in kubernetes/
        run: |
          kubeconform -strict -summary \
            -ignore-filename-pattern 'kustomization.yaml' \
            -ignore-filename-pattern 'values.yaml' \
            -ignore-filename-pattern 'patch-.*.yaml' \
            -skip Kustomization,Component,Application,ApplicationSet,AppProject,ServiceMonitor,PrometheusRule,ScaledObject,AnalysisTemplate,AnalysisRun,Kafka,KafkaTopic,KafkaUser \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -schema-location 'https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            kubernetes/
