name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  STRIMZI_VERSION: "0.40.0"
  KEDA_VERSION: "2.13.0"

jobs:
  helm-lint:
    name: Helm lint + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.14.0"

      - name: Set up kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz && sudo mv kubeconform /usr/local/bin/

      - name: Download Strimzi + KEDA CRD schemas
        run: |
          mkdir -p /tmp/crd-schemas/strimzi /tmp/crd-schemas/keda
          # Strimzi CRDs → kubeconform schema format
          curl -sSL "https://github.com/strimzi/strimzi-kafka-operator/releases/download/${STRIMZI_VERSION}/strimzi-crds-${STRIMZI_VERSION}.yaml" \
            -o /tmp/crd-schemas/strimzi/crds.yaml
          curl -sSL "https://github.com/kedacore/keda/releases/download/v${KEDA_VERSION}/keda-${KEDA_VERSION}-crds.yaml" \
            -o /tmp/crd-schemas/keda/crds.yaml

      - name: Helm lint all charts
        run: |
          for chart in helm/*/; do
            echo "==> Linting $chart"
            helm lint "$chart"
          done

      - name: Helm template + kubeconform (demo-app)
        run: |
          helm template demo helm/demo-app \
            | kubeconform -strict -summary \
              -schema-location default \
              -schema-location '/tmp/crd-schemas/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -schema-location 'https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      - name: Helm template + kubeconform (vllm)
        run: |
          helm template vllm helm/vllm \
            | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -schema-location 'https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  kustomize-validate:
    name: Kustomize build + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kustomize
        # Pinned direct download — the upstream install_kustomize.sh script breaks
        # intermittently (its release-asset glob fails to find the tarball).
        env:
          KUSTOMIZE_VERSION: "5.4.3"
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz && sudo mv kustomize /usr/local/bin/

      - name: Set up kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz && sudo mv kubeconform /usr/local/bin/

      - name: Build + validate dev overlay
        run: |
          kustomize build kustomize/overlays/dev \
            | kubeconform -strict -summary -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -schema-location 'https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      - name: Build + validate dev app overlays
        run: |
          for overlay in kustomize/overlays/dev/*/; do
            kustomize build "$overlay" \
              | kubeconform -strict -summary -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -schema-location 'https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

      - name: Build + validate prod overlay
        run: |
          kustomize build kustomize/overlays/prod \
            | kubeconform -strict -summary -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -schema-location 'https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      - name: Build + validate prod app overlays
        run: |
          for overlay in kustomize/overlays/prod/*/; do
            kustomize build "$overlay" \
              | kubeconform -strict -summary -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -schema-location 'https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  kube-linter:
    name: kube-linter best-practice checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run kube-linter on kubernetes/
        uses: stackrox/kube-linter-action@v1
        with:
          directory: kubernetes/
          config: .kube-linter.yaml
          # Pin the binary — `latest` renames/adds checks and breaks the config.
          version: v0.8.3

  opa-policies:
    name: OPA / conftest policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up conftest
        run: |
          # conftest release assets embed the version in the filename
          # (conftest_<ver>_Linux_x86_64.tar.gz), so the version-less
          # /latest/download/ URL 404s. Pin an explicit version instead.
          CONFTEST_VERSION=0.56.0
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz && sudo mv conftest /usr/local/bin/

      - name: Set up kustomize
        # Pinned direct download — the upstream install_kustomize.sh script breaks
        # intermittently (its release-asset glob fails to find the tarball).
        env:
          KUSTOMIZE_VERSION: "5.4.3"
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz && sudo mv kustomize /usr/local/bin/

      # --combine evaluates the whole rendered overlay as one set, so policies can
      # check RELATIONSHIPS (e.g. does a NetworkPolicy actually select each
      # workload's pods?), not just per-document shape.
      - name: Run OPA policies (dev overlay)
        run: |
          kustomize build kustomize/overlays/dev \
            | conftest test --combine --policy policy/ -

      - name: Run OPA policies (prod overlay)
        run: |
          kustomize build kustomize/overlays/prod \
            | conftest test --combine --policy policy/ -

  terraform-validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform validate (dev)
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform validate (prod)
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend=false
          terraform validate

  app-lint:
    name: Python lint (apps)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [echo-service, worker-service, llm-gateway, audio-api, stt-worker, tts-worker, llm-worker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # ruff is a static analyzer — no need to install the app's deps to lint.
      # Config is the repo-root pyproject.toml ([tool.ruff]). Lints the whole
      # app dir (main.py + the app/ package + tests); ruff excludes .venv etc.
      - name: Ruff lint
        run: uvx ruff check apps/${{ matrix.app }}

      - name: Ruff format check
        run: uvx ruff format --check apps/${{ matrix.app }}

  app-test:
    name: Python tests (apps)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [echo-service, worker-service, llm-gateway, audio-api, stt-worker, tts-worker, llm-worker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "apps/${{ matrix.app }}/uv.lock"

      - name: Install deps (runtime + test) from lockfile
        working-directory: apps/${{ matrix.app }}
        run: uv sync --frozen

      - name: Run pytest
        working-directory: apps/${{ matrix.app }}
        run: uv run --frozen pytest -q

  app-build:
    name: Docker build (apps)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [echo-service, worker-service, llm-gateway, audio-api, stt-worker, tts-worker, llm-worker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: apps/${{ matrix.app }}
          push: false
          tags: platform-core/${{ matrix.app }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  checkov:
    name: Checkov security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          output_format: cli
          # CKV_TF_1 wants module sources pinned to a git commit hash. Our modules
          # come from the Terraform Registry pinned with semver (~> X.0); commit-hash
          # pinning is not applicable to registry sources, and CKV_TF_2 (version tag
          # present) already passes. Skip only this one check.
          skip_check: CKV_TF_1

  trivy-iac:
    name: Trivy IaC + Dockerfile misconfig scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches misconfigurations across Terraform, Kubernetes manifests and
      # Dockerfiles (privileged pods, missing securityContext, broad IAM, etc.)
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.20.0
        # Reviewed, justified exceptions (third-party module / false positive /
        # intentional design) live in .trivyignore.yaml. We point Trivy at it via
        # TRIVY_IGNOREFILE rather than the action's `trivyignores` input: that
        # input cats the file into an extension-less `./trivyignores`, which Trivy
        # then parses with the *plain* (one-id-per-line) parser, silently dropping
        # the YAML structure and all path scoping. The env var preserves the .yaml
        # extension so the structured, path-scoped parser is used.
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
          skip-dirs: ".github"

  kubernetes-validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz && sudo mv kubeconform /usr/local/bin/

      - name: Validate all manifests in kubernetes/
        run: |
          kubeconform -strict -summary \
            -ignore-filename-pattern 'kustomization.yaml' \
            -ignore-filename-pattern 'values.yaml' \
            -ignore-filename-pattern 'patch-.*.yaml' \
            -skip Kustomization,Component,Application,ApplicationSet,AppProject,ServiceMonitor,PrometheusRule,ScaledObject,AnalysisTemplate,AnalysisRun,Kafka,KafkaNodePool,KafkaTopic,KafkaUser,Provider,Function,DeploymentRuntimeConfig,ProviderConfig,CompositeResourceDefinition,Composition,ObjectStorageBucket,EC2NodeClass,NodePool \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -schema-location 'https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            kubernetes/

  e2e-smoke:
    name: e2e smoke (echo-service on kind)
    runs-on: ubuntu-latest
    # Real-cluster smoke: build the image, load it into kind, apply the actual
    # dev overlay, and prove echo-service rolls out and serves traffic. Catches
    # the API-server/CRD-schema and rollout issues that static validation
    # (kubeconform skips CRDs) can't.
    env:
      KIND_CLUSTER: e2e
      ROLLOUTS_VERSION: v1.7.2
      PROM_OPERATOR_VERSION: v0.76.0
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.23.0
          node_image: kindest/node:v1.30.0
          cluster_name: e2e

      - name: Install Argo Rollouts (controller + CRDs)
        run: |
          kubectl create namespace argo-rollouts
          kubectl apply -n argo-rollouts \
            -f "https://github.com/argoproj/argo-rollouts/releases/download/${ROLLOUTS_VERSION}/install.yaml"
          # Give the controller image pull headroom on cold runners (it pulls
          # right after the kind node image). Surface pod state if it stalls.
          kubectl -n argo-rollouts rollout status deploy/argo-rollouts --timeout=300s || {
            echo "::group::argo-rollouts diagnostics"
            kubectl -n argo-rollouts get pods -o wide
            kubectl -n argo-rollouts describe deploy/argo-rollouts
            kubectl -n argo-rollouts get events --sort-by=.lastTimestamp | tail -30
            echo "::endgroup::"
            exit 1
          }

      - name: Install ServiceMonitor CRD (so the overlay applies)
        run: |
          kubectl apply -f "https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/${PROM_OPERATOR_VERSION}/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml"

      - name: Build + load echo-service image
        run: |
          docker build -t echo-service:latest apps/echo-service
          kind load docker-image echo-service:latest --name "${KIND_CLUSTER}"

      - name: Deploy echo-service (dev overlay)
        run: |
          kubectl create namespace apps
          kubectl apply -k kustomize/overlays/dev/echo-service

      - name: Install kubectl-argo-rollouts plugin
        run: |
          curl -sSL -o kubectl-argo-rollouts \
            "https://github.com/argoproj/argo-rollouts/releases/download/${ROLLOUTS_VERSION}/kubectl-argo-rollouts-linux-amd64"
          chmod +x kubectl-argo-rollouts && sudo mv kubectl-argo-rollouts /usr/local/bin/

      - name: Wait for the rollout to be healthy
        run: kubectl argo rollouts status echo-service -n apps --timeout 240s

      - name: Smoke test /healthz and /
        run: |
          kubectl -n apps port-forward svc/echo-service 18080:80 &
          trap 'kill %1 2>/dev/null || true' EXIT
          ok=""
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:18080/healthz; then ok=1; break; fi
            sleep 3
          done
          [ -n "$ok" ] || { echo "::error::/healthz never returned 200"; exit 1; }
          curl -sf http://localhost:18080/ | grep -q 'echo-service'

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl describe rollout echo-service -n apps || true
          kubectl logs -n apps -l app=echo-service --tail=80 || true
          kubectl get events -n apps --sort-by=.lastTimestamp | tail -40 || true
