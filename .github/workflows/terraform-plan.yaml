name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write    # post plan as PR comment

jobs:
  plan:
    name: Terraform Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]

    steps:
      - uses: actions/checkout@v4

      - name: Verify OIDC is configured
        shell: bash
        run: |
          if [[ -z "${{ vars.AWS_OIDC_ROLE_ARN }}" ]]; then
            echo "::error title=Missing OIDC Configuration::AWS_OIDC_ROLE_ARN repo variable is not set."
            echo ""
            echo "Terraform plan requires AWS credentials via GitHub OIDC."
            echo "Steps to fix:"
            echo "  1. Apply terraform/modules/github-oidc to create the IAM role."
            echo "  2. Copy the role ARN from terraform output."
            echo "  3. Add it under: Settings → Secrets and variables → Actions → Variables"
            echo "     Variable name: AWS_OIDC_ROLE_ARN"
            exit 1
          fi
          echo "AWS_OIDC_ROLE_ARN is configured — proceeding with Terraform plan."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform init
        working-directory: terraform/environments/${{ matrix.env }}
        run: terraform init

      - name: Terraform plan
        id: plan
        working-directory: terraform/environments/${{ matrix.env }}
        run: |
          terraform plan -no-color 2>&1 | tee /tmp/plan-${{ matrix.env }}.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planFile = '/tmp/plan-${{ matrix.env }}.txt';
            let plan = '';
            try { plan = fs.readFileSync(planFile, 'utf8'); } catch (e) { plan = '(no output)'; }
            // Truncate to stay within GitHub comment size limits
            if (plan.length > 60000) plan = plan.substring(0, 60000) + '\n...(truncated)';

            const output = `#### Terraform Plan — \`${{ matrix.env }}\` ${{ steps.plan.outcome == 'success' && '✅' || '❌' }}

            <details><summary>Show Plan</summary>

            \`\`\`
            ${plan}
            \`\`\`

            </details>

            *Triggered by @${{ github.actor }}, workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
