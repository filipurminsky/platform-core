name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yaml"

# Least privilege: nothing at workflow level; the job asks for what it needs.
permissions: {}

env:
  # >= 1.10 is required (S3-native state locking via `use_lockfile`).
  TERRAFORM_VERSION: "1.17.1"

jobs:
  plan:
    name: Terraform Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    # Skip (not fail) when a plan can't run: fork PRs get no OIDC token / repo
    # variables, and until terraform/modules/github-oidc is applied and the repo
    # variable AWS_OIDC_ROLE_ARN is set there is no AWS identity to plan with.
    # Same convention as docker-build.yaml. Static Terraform checks (fmt,
    # validate, Checkov, Trivy) still run in ci.yaml on every PR.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_OIDC_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write # OIDC → AWS (read-only plan role)
      pull-requests: write # post plan as PR comment
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    env:
      # Dev's EKS public API endpoint is CIDR-restricted and the variable has no
      # default on purpose. Set the repo variable TF_API_ALLOWED_CIDRS (Settings →
      # Secrets and variables → Actions → Variables) to an HCL list, e.g.
      #   ["203.0.113.10/32"]
      # Prod defaults to [] (private-only endpoint); the same value is passed.
      TF_VAR_api_allowed_cidrs: ${{ vars.TF_API_ALLOWED_CIDRS }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify required variables are configured
        shell: bash
        env:
          TF_ENV: ${{ matrix.env }}
        run: |
          if [[ "$TF_ENV" == "dev" && -z "${TF_VAR_api_allowed_cidrs}" ]]; then
            echo "::error title=Missing TF_API_ALLOWED_CIDRS::Set repo variable TF_API_ALLOWED_CIDRS to an HCL list such as [\"203.0.113.10/32\"] (dev api_allowed_cidrs has no default)."
            exit 1
          fi
          # Prod has a default ([]); don't pass an empty string through.
          if [[ -z "${TF_VAR_api_allowed_cidrs}" ]]; then
            echo "TF_VAR_api_allowed_cidrs=[]" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        working-directory: terraform/environments/${{ matrix.env }}
        run: terraform init

      - name: Terraform plan
        id: plan
        working-directory: terraform/environments/${{ matrix.env }}
        run: |
          terraform plan -no-color -lock=false 2>&1 | tee /tmp/plan-${{ matrix.env }}.txt
          exit "${PIPESTATUS[0]}"
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TF_ENV: ${{ matrix.env }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.TF_ENV;
            let plan = '';
            try { plan = fs.readFileSync(`/tmp/plan-${env}.txt`, 'utf8'); } catch (e) { plan = '(no output)'; }
            // Truncate to stay within GitHub comment size limits
            if (plan.length > 60000) plan = plan.substring(0, 60000) + '\n...(truncated)';
            const icon = process.env.PLAN_OUTCOME === 'success' ? '✅' : '❌';

            const output = `#### Terraform Plan — \`${env}\` ${icon}

            <details><summary>Show Plan</summary>

            \`\`\`
            ${plan}
            \`\`\`

            </details>

            *Triggered by @${context.actor}, workflow: \`${context.workflow}\`*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
