name: Docker Build, Scan, Sign & Push

on:
  push:
    branches: [main]
    paths:
      - "services/**"
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1

# No static cloud credentials anywhere. id-token lets us:
#   - federate into AWS via OIDC (configure-aws-credentials, role-to-assume)
#   - sign images keyless with cosign (Fulcio/Rekor)
permissions:
  id-token: write
  contents: write # commit the image-tag bump back to the repo
  packages: read

jobs:
  # Gate: never build, sign, or promote an image whose app tests are failing.
  # Reuses the shared test workflow to avoid running the 7-app matrix twice when
  # ci.yaml is also triggered on the same push (ci.yaml runs on every push to main;
  # docker-build.yaml is additionally triggered when services/** changes).
  test:
    name: Python tests
    uses: ./.github/workflows/test-apps.yaml

  build:
    name: Build & sign ${{ matrix.app }}
    needs: test
    # Build/push/scan/sign/promote all require AWS (ECR + OIDC). Skip the whole
    # job when AWS_OIDC_ROLE_ARN isn't configured (e.g. forks, or before the
    # github-oidc Terraform module is applied) so the workflow is green rather
    # than red-by-default. The `test` gate above always runs. Dockerfiles are
    # still build-validated on every push by the `app-build` job in ci.yaml.
    if: ${{ vars.AWS_OIDC_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [echo-service, worker-service, llm-gateway, audio-api, stt-worker, llm-worker, tts-worker]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Role ARN is an output of terraform/modules/github-oidc.
          # Stored as a repo variable, not a secret (it is not sensitive).
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image reference
        id: ref
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          echo "repo=${REGISTRY}/platform-core/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build to the local docker daemon (no push) so we can scan BEFORE anything
      # reaches ECR. cache-to primes the GHA cache; the later push build reuses
      # every layer, so this is not a redundant full rebuild.
      - name: Build image for scanning (local, no push)
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.app }}
          load: true
          tags: ${{ matrix.app }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Vulnerability gate runs on the local image. A HIGH/CRITICAL finding fails
      # the job here, so the image never gets pushed, signed, or promoted.
      - name: Scan image for vulnerabilities (fail on HIGH/CRITICAL — gate before push)
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: ${{ matrix.app }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # Only reached if the scan passed. Rebuilds from cache (fast) and pushes
      # with SBOM + max-mode SLSA provenance attached to the image index —
      # verifiable later with `cosign verify-attestation`. No mutable :latest tag.
      - name: Build & push (with SBOM + SLSA provenance attestations)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.app }}
          push: true
          tags: ${{ steps.ref.outputs.repo }}:${{ steps.ref.outputs.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless — identity bound to this workflow)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${{ steps.ref.outputs.repo }}@${DIGEST}"

      # Promote by pinning the IMMUTABLE DIGEST (not a mutable tag) into the
      # per-app prod overlay that the ApplicationSet actually deploys
      # (overlays/prod/<app>, NOT the aggregate overlays/prod). ArgoCD then syncs
      # the digest. The matrix runs in parallel, but each app edits its own
      # overlay dir, so a rebase-and-retry resolves the concurrent push race.
      - name: Promote to prod overlay (pin by immutable digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          KUSTOMIZE_VERSION: "5.4.3"
        run: |
          # Pinned direct download — the upstream install_kustomize.sh script
          # breaks intermittently (its release-asset glob fails to find the tarball).
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp kustomize && sudo mv /tmp/kustomize /usr/local/bin/
          KUSTOMIZE="$(command -v kustomize)"
          ( cd services/${{ matrix.app }}/k8s/overlays/prod \
            && "$KUSTOMIZE" edit set image "${{ matrix.app }}=${{ steps.ref.outputs.repo }}@${DIGEST}" )
          # The four audio services also need the account-specific IRSA role ARN.
          # Resolve it from the same AWS identity used for ECR promotion so the
          # checked-in placeholder can never reach a promoted prod deployment.
          case "${{ matrix.app }}" in
            audio-api|stt-worker|llm-worker|tts-worker)
              ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
              ROLE_PATCH="services/${{ matrix.app }}/k8s/overlays/prod/patch-serviceaccount-irsa.yaml"
              sed -i -E "s#arn:aws:iam::[0-9]+:role/platform-core-prod-audio-pipeline#arn:aws:iam::${ACCOUNT_ID}:role/platform-core-prod-audio-pipeline#" "$ROLE_PATCH"
              ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add services/${{ matrix.app }}/k8s/overlays/prod
          git commit -m "chore(${{ matrix.app }}): promote ${{ steps.ref.outputs.sha }} (${DIGEST})" || exit 0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            sleep $(( (RANDOM % 5) + 1 ))
          done
          echo "::error::failed to push promotion commit after retries" && exit 1
