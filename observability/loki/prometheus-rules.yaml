apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loki-alerts
  namespace: monitoring
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: loki.rules
      rules:
        - alert: LokiRequestErrors
          expr: 100 * sum(rate(loki_request_duration_seconds_count{status_code=~"5.."}[1m])) / sum(rate(loki_request_duration_seconds_count[1m])) > 10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Loki high error rate"
            description: "Loki is returning 5xx errors for > 10% of requests."
        # Promtail was replaced by Grafana Alloy (kubernetes/platform/alloy).
        # loki.write exposes loki_write_* client metrics; dropped entries mean
        # logs never reached Loki (retries exhausted / 4xx).
        - alert: AlloyLogsDropped
          expr: sum by (pod) (rate(loki_write_dropped_entries_total[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Alloy dropping logs bound for Loki"
            description: "Alloy pod {{ $labels.pod }} is dropping log entries when sending to Loki."
