apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-core-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:

    # ── Kubernetes health ────────────────────────────────────────────────────
    - name: kubernetes.health
      rules:
        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total[15m]) > 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "{{ $labels.pod }} in {{ $labels.namespace }} has restarted {{ $value | humanize }} times in the last 15 minutes."
            runbook_url: "https://github.com/filipurminsky/platform-core/blob/main/docs/runbooks/pod-crash-loop.md"

        - alert: NodeMemoryPressure
          expr: |
            (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
              / node_memory_MemTotal_bytes > 0.90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} memory > 90%"
            description: "Node {{ $labels.instance }} has {{ $value | humanizePercentage }} memory utilisation."

    # ── SLO burn rate ────────────────────────────────────────────────────────
    - name: slo.burn_rate
      rules:
        - alert: HighErrorRate
          # Standard 5m + 1h multiwindow burn-rate alert (14.4x burn).
          # A fast burn (e.g. 100% error rate) will page in minutes via the 5m
          # window, while a sustained slow burn pages via the 1h window.
          expr: |
            (
              sum(rate(echo_requests_total{status=~"5.."}[5m]))
              /
              sum(rate(echo_requests_total[5m])) > 14.4 * 0.005
            )
            and
            (
              sum(rate(echo_requests_total{status=~"5.."}[1h]))
              /
              sum(rate(echo_requests_total[1h])) > 14.4 * 0.005
            )
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "High SLO burn rate — error budget at risk"
            description: "Error rate burn rate is high across both 5m and 1h windows, exceeding the 14.4× 0.5% SLO threshold."
            runbook_url: "https://github.com/filipurminsky/platform-core/blob/main/docs/runbooks/high-error-rate.md"

    # ── ArgoCD ───────────────────────────────────────────────────────────────
    - name: argocd
      rules:
        - alert: ArgoCDAppDegraded
          expr: |
            argocd_app_info{health_status="Degraded"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD application {{ $labels.name }} is degraded"
            description: "Application {{ $labels.name }} in project {{ $labels.project }} has health status Degraded."

    # ── Kafka ────────────────────────────────────────────────────────────────
    # NOTE: KafkaConsumerLagHigh, KafkaDLQNonEmpty, and the audio-pipeline DLQ
    # alerts below all depend on metrics from the Strimzi Kafka Exporter
    # (kafka_consumergroup_lag_sum, kafka_consumergroup_lag). The exporter is
    # DISABLED in the dev overlay (patch-kafka-dev.yaml) to save resources.
    # These alerts are effectively prod-only and will not fire on local kind clusters.
    - name: kafka
      rules:
        - alert: KafkaConsumerLagHigh
          # NB: the exporter labels consumer groups `consumergroup=`, not `group=`.
          expr: |
            kafka_consumergroup_lag_sum{consumergroup="worker-service"} > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "worker-service Kafka consumer lag is high"
            description: "Consumer group worker-service has a total lag of {{ $value }} messages across all partitions."
            runbook_url: "https://github.com/filipurminsky/platform-core/blob/main/docs/runbooks/kafka-consumer-lag.md"

        - alert: KafkaDLQNonEmpty
          # Watch the topic's produced offset, NOT consumer-group lag: nothing
          # consumes the DLQ topics, so no consumer group (and no lag series)
          # ever exists for them — a lag-based alert can never fire.
          expr: |
            sum(delta(kafka_topic_partition_current_offset{topic="jobs-dlq"}[5m])) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Messages arriving in Kafka DLQ — processing failures detected"
            description: "{{ $value }} message(s) dead-lettered to jobs-dlq in the last 5m. Investigate worker-service for processing errors."
            runbook_url: "https://github.com/filipurminsky/platform-core/blob/main/docs/runbooks/kafka-consumer-lag.md"

        - alert: KafkaBrokerDown
          # Uses < 1 (not < 3) so the alert fires when ALL brokers stop reporting —
          # dev has a single-node cluster; < 3 would false-alert there if the exporter
          # were ever enabled. Prod's 3-broker health is covered by replication factor
          # and ISR alerts in production monitoring.
          expr: |
            count(kafka_server_replicamanager_leadercount) < 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "All Kafka brokers have stopped reporting metrics"
            description: "No Kafka brokers are reporting metrics. Expected at least 1."

    # ── vLLM ─────────────────────────────────────────────────────────────────
    - name: vllm
      rules:
        - alert: VllmLatencyBreach
          expr: |
            histogram_quantile(0.90,
              rate(vllm:e2e_request_latency_seconds_bucket[5m])
            ) > 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "vLLM p90 latency > 5 seconds"
            description: "vLLM p90 request latency is {{ $value | humanizeDuration }}, breaching the 5 s SLO."
            runbook_url: "https://github.com/filipurminsky/platform-core/blob/main/docs/runbooks/vllm-inference-latency.md"

        - alert: GpuNodeUnavailable
          # Depends on kube-state-metrics exposing the node `role` label:
          # metricLabelsAllowlist "nodes=[role]" in the monitoring Application
          # values. If that allowlist is removed, kube_node_labels has no series
          # and this alert false-fires whenever vLLM has replicas.
          expr: |
            kube_deployment_status_replicas{deployment="vllm-inference"} > 0
            unless
            kube_node_status_condition{condition="Ready",status="true"}
              * on(node) group_left()
              kube_node_labels{label_role="gpu"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "vLLM replicas running but no GPU node is Ready"
            description: "vLLM has {{ $value }} replicas but no GPU node is available. Pods will be pending."

    # ── Audio AI Pipeline ────────────────────────────────────────────────────
    - name: audio.pipeline
      rules:
        - alert: AudioSTTDLQNonEmpty
          # Produced-offset based — no consumer group exists for DLQ topics, so
          # consumer-lag metrics never would (see KafkaDLQNonEmpty above).
          expr: |
            sum(delta(kafka_topic_partition_current_offset{topic="audio.stt-dlq"}[5m])) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Messages arriving in STT DLQ — stt-worker processing failures detected"
            description: "{{ $value }} message(s) dead-lettered to audio.stt-dlq in the last 5m. Investigate stt-worker for processing errors."
            runbook_url: "https://github.com/filipurminsky/platform-core/blob/main/docs/runbooks/kafka-consumer-lag.md"

        - alert: AudioLLMDLQNonEmpty
          # Produced-offset based — no consumer group exists for DLQ topics, so
          # consumer-lag metrics never would (see KafkaDLQNonEmpty above).
          expr: |
            sum(delta(kafka_topic_partition_current_offset{topic="audio.llm-dlq"}[5m])) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Messages arriving in LLM DLQ — llm-worker processing failures detected"
            description: "{{ $value }} message(s) dead-lettered to audio.llm-dlq in the last 5m. Investigate llm-worker for processing errors."
            runbook_url: "https://github.com/filipurminsky/platform-core/blob/main/docs/runbooks/kafka-consumer-lag.md"

        - alert: AudioTTSDLQNonEmpty
          # Produced-offset based — no consumer group exists for DLQ topics, so
          # consumer-lag metrics never would (see KafkaDLQNonEmpty above).
          expr: |
            sum(delta(kafka_topic_partition_current_offset{topic="audio.tts-dlq"}[5m])) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Messages arriving in TTS DLQ — tts-worker processing failures detected"
            description: "{{ $value }} message(s) dead-lettered to audio.tts-dlq in the last 5m. Investigate tts-worker for processing errors."
            runbook_url: "https://github.com/filipurminsky/platform-core/blob/main/docs/runbooks/kafka-consumer-lag.md"

        - alert: AudioPipelineHighFailureRate
          expr: |
            sum(rate(pipeline_jobs_failed_total[15m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Audio pipeline is experiencing sustained job failures"
            description: "pipeline_jobs_failed_total is increasing at {{ $value | humanize }} jobs/s over the last 15 minutes. Check DLQ depths and worker logs."
            runbook_url: "https://github.com/filipurminsky/platform-core/blob/main/docs/runbooks/kafka-consumer-lag.md"
