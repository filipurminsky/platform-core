apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-core-slo-recording-rules
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    # ── HTTP SLO — availability (30-day window) ───────────────────────────────
    - name: slo.availability
      interval: 30s
      rules:
        - record: slo:http_request_success:ratio_rate5m
          expr: |
            sum(rate(echo_requests_total{status!~"5.."}[5m]))
            /
            sum(rate(echo_requests_total[5m]))

        - record: slo:http_request_success:ratio_rate30d
          expr: |
            sum(rate(echo_requests_total{status!~"5.."}[30d]))
            /
            sum(rate(echo_requests_total[30d]))

    # ── HTTP SLO — latency (95th percentile) ─────────────────────────────────
    - name: slo.latency
      interval: 30s
      rules:
        - record: slo:http_request_duration_p95:rate5m
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(echo_request_duration_seconds_bucket[5m]))
            )

    # ── vLLM SLO ─────────────────────────────────────────────────────────────
    - name: slo.vllm
      interval: 30s
      rules:
        - record: vllm:e2e_request_latency_seconds:p90_rate5m
          expr: |
            histogram_quantile(0.90,
              sum by (le) (rate(vllm:e2e_request_latency_seconds_bucket[5m]))
            )

        - record: vllm:request_error_ratio:rate5m
          expr: |
            sum(rate(vllm:request_failure_total[5m]))
            /
            sum(rate(vllm:request_success_total[5m]) + rate(vllm:request_failure_total[5m]))

        # Error budget remaining (30-day window, 99.0% availability target)
        - record: vllm:error_budget_remaining:ratio
          expr: |
            1 - (
              (1 - sum(rate(vllm:request_success_total[30d]))
                   / sum(rate(vllm:request_success_total[30d]) + rate(vllm:request_failure_total[30d])))
              /
              (1 - 0.990)
            )

    # ── Kafka consumer lag ────────────────────────────────────────────────────
    - name: slo.kafka
      interval: 30s
      rules:
        - record: kafka:worker_service_lag:sum
          expr: |
            kafka_consumergroup_lag_sum{group="worker-service"}

        - record: kafka:worker_service_lag:max_partition
          expr: |
            max(kafka_consumergroup_lag{group="worker-service"})

    # ── Audio AI Pipeline SLOs ────────────────────────────────────────────────
    - name: audio.pipeline
      interval: 30s
      rules:
        - record: audio:pipeline_e2e_p95:rate5m
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(pipeline_end_to_end_duration_seconds_bucket[5m]))
            )

        - record: audio:pipeline_e2e_p50:rate5m
          expr: |
            histogram_quantile(0.50,
              sum by (le) (rate(pipeline_end_to_end_duration_seconds_bucket[5m]))
            )

        - record: audio:stt_throughput:rate5m
          expr: |
            sum(rate(stt_jobs_total[5m]))

        - record: audio:llm_throughput:rate5m
          expr: |
            sum(rate(llm_jobs_total[5m]))

        - record: audio:tts_throughput:rate5m
          expr: |
            sum(rate(tts_jobs_total[5m]))

        - record: audio:pipeline_failure_rate:rate5m
          expr: |
            sum(rate(pipeline_jobs_failed_total[5m]))
