# Materializes the llm-gateway bearer API keys from AWS Secrets Manager into the
# llm-gateway-api-keys Secret (apps namespace):
#   api-keys   — CSV of every accepted key → llm-gateway GATEWAY_API_KEYS
#   llm-worker — the single key llm-worker presents to the gateway
# Uses the cluster-wide aws-secrets-manager store
# (kubernetes/platform/external-secrets-config); the path follows the
# <project>/<environment>/* convention the ESO IAM policy is scoped to.
#
# Seed once per account (keep llm-worker's key inside the api-keys CSV):
#   A=$(openssl rand -hex 32); B=$(openssl rand -hex 32)
#   aws secretsmanager create-secret --name platform-core/prod/llm-gateway-api-keys \
#     --secret-string "{\"api-keys\":\"$A,$B\",\"llm-worker\":\"$B\"}"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-api-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: llm-gateway-api-keys
    creationPolicy: Owner
  data:
    - secretKey: api-keys
      remoteRef:
        key: platform-core/prod/llm-gateway-api-keys
        property: api-keys
    - secretKey: llm-worker
      remoteRef:
        key: platform-core/prod/llm-gateway-api-keys
        property: llm-worker
