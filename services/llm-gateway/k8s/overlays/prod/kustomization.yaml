apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/part-of: platform-core
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false

patches:
  - path: patch-resources.yaml
    target:
      kind: Deployment
      name: llm-gateway
  - path: patch-redis.yaml
    target:
      kind: Deployment
      name: llm-gateway

replicas:
  - name: llm-gateway
    count: 2

# Pinned by immutable digest on promotion: docker-build.yaml runs
# `kustomize edit set image llm-gateway=<repo>@sha256:<digest>`. Never ':latest'
# in prod — Kyverno disallow-latest-tag is Enforce here. Until the first
# promotion this 'unpromoted' tag is un-pullable, so an un-promoted prod fails
# closed (ImagePullBackOff) instead of silently running a mutable tag.
images:
  - name: llm-gateway
    newName: 123456789.dkr.ecr.eu-west-1.amazonaws.com/platform-core/llm-gateway
    newTag: unpromoted
