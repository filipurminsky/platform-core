# Dev-only north-south route (http://llm-gateway.platform-core.local on kind).
# Prod deliberately ships NO route: the gateway is cluster-internal there and is
# reached only by in-cluster callers (llm-worker, tenants on :80/:8080).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-gateway
  labels:
    app: llm-gateway
    app.kubernetes.io/part-of: platform-core
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - llm-gateway.platform-core.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: llm-gateway
          port: 80
