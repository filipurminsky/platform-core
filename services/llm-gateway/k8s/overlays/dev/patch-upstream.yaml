# Dev: point the gateway at the in-cluster OpenAI mock (mock-vllm.yaml) instead of
# the real vllm-inference, which cannot run on a GPU-less kind node.
#
# Written as a JSON6902 op (not a strategic-merge Deployment) so Trivy's config
# scan doesn't read this partial patch as a standalone workload and flag the
# base's securityContext as missing — same reason patch-resources.yaml is an
# op-list. The VLLM_BASE_URL env var is index 0 in the base container's env.
- op: replace
  path: /spec/template/spec/containers/0/env/0/value
  value: http://vllm-mock:8000
