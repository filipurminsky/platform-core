# Dev: point the gateway at the in-cluster OpenAI mock (mock-vllm.yaml) instead of
# the real vllm-inference, which cannot run on a GPU-less kind node.
#
# Strategic merge uses the env list's `name` merge key, so reordering the base
# environment cannot silently patch the wrong variable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
spec:
  template:
    spec:
      containers:
        - name: llm-gateway
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: VLLM_BASE_URL
              value: http://vllm-mock:8000
