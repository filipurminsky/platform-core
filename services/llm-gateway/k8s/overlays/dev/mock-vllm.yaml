# Dev-only OpenAI-compatible mock for the llm-gateway upstream.
#
# Why: dev/kind has no GPU, and the upstream `vllm/vllm-openai` image is CUDA-only
# (it crashes with "No CUDA GPUs are available" even with --device cpu), so the real
# vllm-inference can never serve on a kind node. This stdlib-only mock lets the audio
# pipeline run end-to-end on CPU. The dev gateway is repointed at it via VLLM_BASE_URL
# (patch-upstream.yaml). Prod is unaffected — it talks to the real vllm-inference.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-mock
data:
  mock.py: |
    """Minimal OpenAI-compatible chat-completions mock (stdlib only)."""
    import json
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    CONTENT = (
        "SUMMARY:\n"
        "This is a mock executive summary generated by the dev vLLM stand-in. "
        "The audio pipeline reached the LLM stage and received a well-formed reply.\n\n"
        "ACTION_ITEMS:\n"
        "- Confirm the end-to-end smoke test passes\n"
        "- Replace this mock with real vLLM on a GPU cluster\n"
    )

    class Handler(BaseHTTPRequestHandler):
        def _send(self, code, body):
            data = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path in ("/health", "/v1/models"):
                self._send(200, {"status": "ok"})
            else:
                self._send(404, {"error": "not found"})

        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0) or 0)
            if length:
                self.rfile.read(length)  # drain body; content ignored
            if self.path == "/v1/chat/completions":
                self._send(200, {
                    "id": "chatcmpl-mock",
                    "object": "chat.completion",
                    "created": int(time.time()),
                    "model": "mock",
                    "choices": [{
                        "index": 0,
                        "message": {"role": "assistant", "content": CONTENT},
                        "finish_reason": "stop",
                    }],
                    "usage": {"prompt_tokens": 16, "completion_tokens": 48, "total_tokens": 64},
                })
            else:
                self._send(404, {"error": "not found"})

        def log_message(self, *args):
            pass  # quiet

    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-mock
  labels:
    app: vllm-mock
    app.kubernetes.io/name: vllm-mock
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: vllm-mock
  template:
    metadata:
      labels:
        app: vllm-mock
        app.kubernetes.io/name: vllm-mock
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/mock.py"]
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: script
              mountPath: /app
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: script
          configMap:
            name: vllm-mock
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-mock
  labels:
    app: vllm-mock
spec:
  selector:
    app: vllm-mock
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-mock
spec:
  podSelector:
    matchLabels:
      app: vllm-mock
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: llm-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
  egress:
    - {}    # DNS
