apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-gateway
spec:
  podSelector:
    matchLabels:
      app: llm-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    # External traffic via ingress-nginx, and Prometheus scraping /metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
    # llm-worker calls the gateway's OpenAI-compatible API (contract §6:
    # workers never talk to vLLM directly, only via this gateway).
    - from:
        - podSelector:
            matchLabels:
              app: llm-worker
      ports:
        - port: 8080
  egress:
    # Upstream inference on :8000 in the apps namespace — the real
    # vllm-inference in prod, the vllm-mock stand-in in dev. The vllm-inference
    # NetworkPolicy still restricts *ingress* to app: llm-gateway, so this does
    # not let anything else reach vLLM.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
      ports:
        - port: 8000
    # Shared rate-limiter backend (Redis) in the platform namespace (prod).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
      ports:
        - port: 6379
    # OTLP span export to the collector in the monitoring namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 4317
          protocol: TCP
    # DNS to CoreDNS only (not unrestricted :53 egress).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
