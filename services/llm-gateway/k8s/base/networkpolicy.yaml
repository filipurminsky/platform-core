apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-gateway
spec:
  podSelector:
    matchLabels:
      app: llm-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    # External traffic via ingress-nginx, and Prometheus scraping /metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
    # llm-worker calls the gateway's OpenAI-compatible API (contract §6:
    # workers never talk to vLLM directly, only via this gateway).
    - from:
        - podSelector:
            matchLabels:
              app: llm-worker
      ports:
        - port: 8080
  egress:
    # Egress to the vLLM inference service (in this namespace) plus DNS. The
    # vllm-inference NetworkPolicy already allows ingress from app: llm-gateway.
    - {}
