apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-gateway
spec:
  # AlwaysAllow lets a node drain evict an unready pod (e.g. mid-restart) instead
  # of stalling on it; safe here, the workload tolerates a replica being evicted.
  unhealthyPodEvictionPolicy: AlwaysAllow
  minAvailable: 1
  selector:
    matchLabels:
      app: llm-gateway
