[project]
name = "llm-gateway"
version = "0.1.0"
description = "FastAPI reverse proxy in front of vLLM (rate limiting, error mapping, metrics)."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "opentelemetry-api==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "opentelemetry-sdk==1.45.2",
    "prometheus-client==0.26.0",
    "structlog==26.1.0",
    "pydantic-settings==2.16.2",
    "redis==8.1.0",
]

[dependency-groups]
# Test-only deps. uv installs the `dev` group by default on `uv sync`.
dev = [
    "pytest==9.2.0",
    # Starlette's TestClient prefers httpx2; the runtime proxy client stays on
    # httpx (that is what opentelemetry-instrumentation-httpx traces).
    "httpx2==2.16.0",
    # In-process Redis with a real Lua engine, to exercise the limiter script.
    "fakeredis[lua]==2.40.0",
]

[tool.uv]
# Flat single-module app (main.py), not an installable package — sync deps only.
package = false

# Ruff config is inherited from the repo-root pyproject.toml.
