apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-service
spec:
  # AlwaysAllow lets a node drain evict an unready pod (e.g. mid-restart) instead
  # of stalling on it; safe here, the workload tolerates a replica being evicted.
  unhealthyPodEvictionPolicy: AlwaysAllow
  # maxUnavailable: 1 allows eviction even at single-replica scale.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: worker-service
