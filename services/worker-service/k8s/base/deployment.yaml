apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  labels:
    app: worker-service
    app.kubernetes.io/name: worker-service
spec:
  revisionHistoryLimit: 3
  replicas: 0                  # KEDA manages replica count; starts at zero
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
        app.kubernetes.io/name: worker-service
    spec:
      serviceAccountName: worker-service
      terminationGracePeriodSeconds: 60    # allow in-flight jobs to drain
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker-service
          image: worker-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: env-config
                  optional: true
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: env-config
                  optional: true
                  key: LOG_LEVEL
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: platform-kafka-kafka-bootstrap.platform.svc.cluster.local:9092
            - name: KAFKA_TOPIC
              value: jobs
            - name: KAFKA_DLQ_TOPIC
              value: jobs-dlq
            - name: KAFKA_CONSUMER_GROUP
              value: worker-service
            # OpenTelemetry — the worker extracts trace context from Kafka message
            # headers and emits a span per job; exported to the collector → Tempo.
            - name: OTEL_SERVICE_NAME
              value: worker-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=apps
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
