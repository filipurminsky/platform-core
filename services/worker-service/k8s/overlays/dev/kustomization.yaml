apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/part-of: platform-core
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false

patches:
  - path: patch-resources.yaml
    target:
      kind: Deployment
      name: worker-service

replicas:
  - name: worker-service
    count: 0

configMapGenerator:
  - name: env-config
    literals:
      - ENVIRONMENT=dev
      - LOG_LEVEL=debug
generatorOptions:
  disableNameSuffixHash: true

images:
  - name: worker-service
    newTag: latest
