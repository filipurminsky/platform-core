apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - ../../base
  - trigger-auth.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: platform-core
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false

patches:
  - path: patch-worker-resources.yaml
    target:
      kind: Deployment
      name: worker-service
  - path: patch-kafka-auth.yaml
    target:
      kind: Deployment
      name: worker-service
  - path: patch-scaledobject-kafka-auth.yaml
    target:
      kind: ScaledObject
      name: worker-service
  - path: patch-kafka-tls-mount.yaml
    target:
      kind: Deployment
      name: worker-service

replicas:
  - name: worker-service
    count: 0

configMapGenerator:
  - name: env-config
    literals:
      - ENVIRONMENT=prod
      - LOG_LEVEL=info
generatorOptions:
  disableNameSuffixHash: true

# Pinned by immutable digest on promotion: docker-build.yaml runs
# `kustomize edit set image worker-service=<repo>@sha256:<digest>`. Never
# ':latest' in prod — Kyverno disallow-latest-tag is Enforce here. Until the
# first promotion this 'unpromoted' tag is un-pullable, so an un-promoted prod
# fails closed (ImagePullBackOff) instead of silently running a mutable tag.
images:
  - name: worker-service
    newName: 123456789.dkr.ecr.eu-west-1.amazonaws.com/platform-core/worker-service
    newTag: unpromoted
