[project]
name = "worker-service"
version = "0.2.0"
description = "Kafka consumer (in-memory dedup, classified retry -> DLQ, graceful drain); scaled by KEDA on consumer lag."
requires-python = ">=3.14"
dependencies = [
    "platform-common",
    "confluent-kafka==2.16.1",
    "opentelemetry-api==1.45.2",
    "prometheus-client==0.26.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
]

[dependency-groups]
# Test-only deps. uv installs the `dev` group by default on `uv sync`.
dev = [
    "pytest==9.2.0",
]

[tool.uv]
# Flat single-module app (main.py), not an installable package — sync deps only.
package = false

[tool.uv.sources]
# Shared worker library (services/platform-common). Editable for local dev; the
# Docker build installs it non-editable (uv sync --no-editable).
platform-common = { path = "../platform-common", editable = true }

# Ruff config is inherited from the repo-root pyproject.toml.
