# Local dev stack: Kafka, object/state stores, demo services, and the audio pipeline.
#
# Usage:
#   cd services/
#   docker compose up -d --build
#
# Images build with context `services/` (this directory) and
# `dockerfile: <app>/Dockerfile`, so the shared `platform-common/` library is
# inside the build context — the same layout CI uses.
#   docker compose logs -f worker-service
#   # Produce a test job:
#   docker compose exec kafka kafka-console-producer \
#     --bootstrap-server localhost:9092 --topic jobs <<< \
#     '{"id":"test-001","type":"data-transform","payload":{"input":"hello","operation":"uppercase"}}'

services:
  kafka:
    image: confluentinc/cp-kafka:8.4.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-init:
    image: confluentinc/cp-kafka:8.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    # List form: a plain `command: |` string is shell-split by compose, so
    # `bash -c` would only receive its first word.
    command:
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic jobs --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic jobs-dlq --partitions 1 --replication-factor 1
        for topic in audio.jobs audio.transcripts audio.summaries audio.results \
          audio.stt-dlq audio.llm-dlq audio.tts-dlq; do
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1
        done
        echo "Topics created."

  # S3-compatible object store. MinIO community images are no longer published,
  # so this is SeaweedFS (S3 gateway) — kept under the service name `minio`, on
  # port 9000, with the same access/secret keys, so S3_ENDPOINT_URL and the
  # credentials below are unchanged.
  minio:
    image: chrislusf/seaweedfs:4.52
    command:
      - server
      - -ip.bind=0.0.0.0
      - -dir=/data
      - -s3
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: chrislusf/seaweedfs:4.52
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Idempotent: re-running `compose up` must not fail on an existing bucket.
        if echo "s3.bucket.list" | weed shell -master=minio:9333 | grep -qw audio-pipeline; then
          echo "Bucket audio-pipeline already exists."
        else
          echo "s3.bucket.create -name audio-pipeline" | weed shell -master=minio:9333
        fi

  redis:
    image: redis:7.4.12-alpine  # matches the in-cluster platform/redis major.minor
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "local-redis-password"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "local-redis-password", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  echo-service:
    build:
      context: .
      dockerfile: echo-service/Dockerfile
    container_name: echo-service
    ports:
      - "8081:8080"
    environment:
      APP_VERSION: "local"

  worker-service:
    build:
      context: .
      dockerfile: worker-service/Dockerfile
    container_name: worker-service
    ports:
      - "9091:9090"   # metrics
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: jobs
      KAFKA_DLQ_TOPIC: jobs-dlq
      KAFKA_CONSUMER_GROUP: worker-service
      MAX_RETRIES: "3"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Lightweight OpenAI-compatible mock for vLLM and the audio pipeline.
  vllm-mock:
    image: python:3.13.18-alpine
    container_name: vllm-mock
    command: ["python", "/app/vllm_mock.py"]
    volumes:
      - ./vllm_mock.py:/app/vllm_mock.py:ro
    ports:
      - "8000:8000"

  llm-gateway:
    build:
      context: .
      dockerfile: llm-gateway/Dockerfile
    container_name: llm-gateway
    ports:
      - "8080:8080"
    environment:
      VLLM_BASE_URL: "http://vllm-mock:8000"
      RATE_LIMIT_RPM: "60"
      # Bearer keys accepted on /v1/* (CSV). llm-worker presents the first one.
      GATEWAY_API_KEYS: "local-llm-worker-key"
    depends_on:
      - vllm-mock

  audio-api:
    build:
      context: .
      dockerfile: audio-api/Dockerfile
    ports:
      - "8082:8080"
    environment: &audio-common
      ENVIRONMENT: dev
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: audio-pipeline
      S3_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: local-redis-password
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  stt-worker:
    build:
      context: .
      dockerfile: stt-worker/Dockerfile
    ports:
      - "9192:9090"
    environment:
      <<: *audio-common
      STT_BACKEND: stub
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  llm-worker:
    build:
      context: .
      dockerfile: llm-worker/Dockerfile
    ports:
      - "9093:9090"
    environment:
      <<: *audio-common
      LLM_GATEWAY_URL: http://llm-gateway:8080
      LLM_GATEWAY_API_KEY: local-llm-worker-key
      LLM_MODEL: local-mock
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      llm-gateway:
        condition: service_started

  tts-worker:
    build:
      context: .
      dockerfile: tts-worker/Dockerfile
    ports:
      - "9094:9090"
    environment:
      <<: *audio-common
      TTS_BACKEND: stub
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

configs:
  # SeaweedFS S3 identities: same access/secret key the services use.
  seaweedfs-s3:
    content: |
      {
        "identities": [
          {
            "name": "local",
            "credentials": [{"accessKey": "minio", "secretKey": "minio123"}],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          }
        ]
      }
