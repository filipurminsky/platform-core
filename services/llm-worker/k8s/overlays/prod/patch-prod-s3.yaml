# Prod S3: bucket name from Crossplane connection secret, region eu-west-1.
# Strategic-merge patch: name-keyed, immune to env var reordering in the base.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-worker
spec:
  template:
    spec:
      containers:
        - name: llm-worker
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: audio-pipeline-conn
                  key: bucket
            - name: S3_REGION
              value: eu-west-1
