apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-worker
spec:
  podSelector:
    matchLabels:
      app: llm-worker
  policyTypes: [Ingress, Egress]
  ingress:
    # Prometheus scrape from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
  egress:
    # Kafka + Redis + MinIO in the platform namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
      ports:
        - port: 9092    # Kafka plain
        - port: 9093    # Kafka TLS
        - port: 6379    # Redis
        - port: 9000    # MinIO
    # LLM gateway in the apps namespace. Cilium enforces egress on the backend
    # pod port after Service translation, so allow the gateway's container port
    # (8080), not just the Service port (80).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
      ports:
        - port: 80      # llm-gateway Service port
        - port: 8080    # llm-gateway container port (post-Service-translation)
    # OTLP span export to the in-cluster collector (monitoring namespace).
    # Without this rule Cilium (dev) silently drops every exported span and the
    # cross-service trace breaks at this hop.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 4317
          protocol: TCP
    # DNS to CoreDNS only (not unrestricted :53 egress)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Prod S3 HTTPS
    - ports:
        - port: 443
