apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-worker
  labels:
    app: llm-worker
    app.kubernetes.io/name: llm-worker
spec:
  revisionHistoryLimit: 3
  replicas: 0                  # KEDA manages replica count; starts at zero
  selector:
    matchLabels:
      app: llm-worker
  template:
    metadata:
      labels:
        app: llm-worker
        app.kubernetes.io/name: llm-worker
    spec:
      serviceAccountName: llm-worker
      terminationGracePeriodSeconds: 60    # allow in-flight summarisation jobs to drain
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llm-worker
          image: llm-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: env-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: env-config
                  key: LOG_LEVEL
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: platform-kafka-kafka-bootstrap.platform.svc.cluster.local:9092
            - name: KAFKA_TOPIC_IN
              value: audio.transcripts
            - name: KAFKA_TOPIC_OUT
              value: audio.summaries
            - name: KAFKA_DLQ_TOPIC
              value: audio.llm-dlq
            - name: KAFKA_CONSUMER_GROUP
              value: llm-worker
            # LLM gateway — never vLLM directly (contract §6)
            - name: LLM_GATEWAY_URL
              value: http://llm-gateway.apps.svc.cluster.local:80
            # In dev the gateway proxies to TinyLlama; low quality by design (pipeline wiring demo)
            - name: LLM_MODEL
              value: TinyLlama/TinyLlama-1.1B-Chat-v1.0
            # S3 / MinIO — endpoint unset in prod (uses AWS default); set to MinIO URL in dev
            - name: S3_BUCKET
              value: audio-pipeline
            - name: S3_REGION
              value: eu-west-1
            # Redis job-state (§5)
            - name: REDIS_URL
              value: redis://redis.platform.svc.cluster.local:6379/0
            - name: JOB_STATE_TTL_SECONDS
              value: "604800"
            # OpenTelemetry — extracts trace context from Kafka headers, injects into produced events
            - name: OTEL_SERVICE_NAME
              value: llm-worker
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=apps
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            # No model weights on this pod — pure HTTP worker; read-only rootfs is safe
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
