[project]
name = "llm-worker"
version = "0.2.0"
description = "Kafka consumer: audio.transcripts → LLM summarisation (via llm-gateway) → audio.summaries; scales to zero via KEDA."
requires-python = ">=3.14"
dependencies = [
    "platform-common[audio]",
    "boto3==1.43.126",
    "confluent-kafka==2.16.1",
    "httpx==0.28.1",
    "opentelemetry-api==1.45.2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "prometheus-client==0.26.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "redis==8.1.0",
]

[dependency-groups]
# Test-only deps. uv installs the `dev` group by default on `uv sync`.
dev = [
    "pytest==9.2.0",
]

[tool.uv]
# Flat single-module app (main.py), not an installable package — sync deps only.
package = false

[tool.uv.sources]
# Shared worker library (services/platform-common). Editable for local dev; the
# Docker build installs it non-editable (uv sync --no-editable).
platform-common = { path = "../platform-common", editable = true }

# Ruff config is inherited from the repo-root pyproject.toml.

[tool.pytest.ini_options]
# anyio's pytest plugin (pulled in by httpx) is unused and warns on pytest 9.
addopts = "-p no:anyio"
