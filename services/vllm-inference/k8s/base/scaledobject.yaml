apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-inference
  namespace: apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-inference
  minReplicaCount: 0          # scale to zero when idle
  maxReplicaCount: 4
  cooldownPeriod: 300         # 5 min; model loading takes time, don't thrash
  pollingInterval: 30
  triggers:
    # 1→N scaling: vLLM's own queue depth. NOTE: this metric is exposed BY the
    # vLLM pods, so it does not exist while the Deployment is at zero replicas —
    # it can never drive 0→1 activation on its own. That's what trigger 2 is for.
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        # sum(): KEDA's Prometheus scaler rejects multi-series results, and
        # every vLLM pod exports its own series. Name/semantics unchanged in
        # the V1 engine (v0.32); `or vector(0)` keeps the query non-empty at 0.
        query: sum(vllm:num_requests_waiting) or vector(0)
        threshold: "5"              # scale up when >5 requests queued
        activationThreshold: "1"    # contributes to activation only when vLLM is already up
    # 0→1 activation: demand observed at llm-gateway, which is always running.
    # While vLLM is scaled to zero the gateway can't reach it, answers 503 +
    # Retry-After and increments gateway_upstream_errors_total — sum both
    # counters so demand is visible in every state (any double count of a
    # failed request only makes activation more eager, which is harmless).
    # `or vector(0)` keeps the query non-empty when a counter has no series yet.
    # (`metricName` is omitted: KEDA ignores it and derives the name itself.)
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        query: |
          (sum(rate(gateway_requests_total[2m])) or vector(0))
          + (sum(rate(gateway_upstream_errors_total[2m])) or vector(0))
        threshold: "10"             # rps per replica for scale-out
        activationThreshold: "0.05" # any sustained request flow wakes vLLM from zero
