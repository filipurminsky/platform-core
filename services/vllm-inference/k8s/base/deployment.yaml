apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  labels:
    app: vllm-inference
    app.kubernetes.io/name: vllm-inference
spec:
  revisionHistoryLimit: 3
  replicas: 0                  # KEDA manages; starts at zero
  selector:
    matchLabels:
      app: vllm-inference
  template:
    metadata:
      labels:
        app: vllm-inference
        app.kubernetes.io/name: vllm-inference
    spec:
      serviceAccountName: vllm-inference
      # seccomp only: the upstream vllm/vllm-openai GPU image is not yet verified to
      # run non-root, so runAsNonRoot is deliberately omitted here. This is the one
      # workload that does not meet the PSS `restricted` profile — hence the apps
      # namespace enforces `baseline` and only warns/audits `restricted`.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      runtimeClassName: nvidia    # patched out in dev overlay (no GPU)
      nodeSelector:
        role: gpu                 # patched out in dev overlay
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule      # removed in dev overlay
      initContainers:
        - name: model-cache-check
          image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: [sh, -c, "ls /model-cache || echo 'Cold start: model will be downloaded'"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534          # nobody — only lists the cache dir
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
      containers:
        - name: vllm
          # v0.32 (V1 engine — the only engine since V0 was removed). The image
          # entrypoint is `vllm serve`, so args below are `vllm serve` flags.
          # -cu129 (CUDA 12.9) rather than the default CUDA 13.0 tag: CUDA 13
          # needs NVIDIA driver >= 580, which the AL2 GPU AMI used by the GPU
          # nodegroup/Karpenter EC2NodeClass does not ship.
          image: vllm/vllm-openai:v0.32.0-cu129
          imagePullPolicy: IfNotPresent
          args:
            - "--model"
            - "mistralai/Mistral-7B-Instruct-v0.2"   # patched by overlay; must match llm-worker LLM_MODEL
            - "--download-dir"
            - "/model-cache"
            - "--dtype"
            - "auto"
            - "--max-model-len"
            - "4096"
            - "--gpu-memory-utilization"
            - "0.90"
            - "--port"
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: token
                  optional: true
            # Keep tokenizer/config downloads (not just weights) on the cache volume.
            - name: HF_HOME
              value: /model-cache/hf
          # vLLM only starts listening once the model is loaded, so /health
          # refuses connections during download + load. startupProbe budgets
          # 10 min for that; liveness/readiness only start once it passes, so
          # they can stay tight without killing a pod mid-load.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health      # 503 once the engine core is dead
              port: http
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"   # patched to 0 in dev overlay
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"   # patched to 0 in dev overlay
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        # Per-pod generic ephemeral volume, NOT a shared PVC: gp3/EBS is
        # ReadWriteOnce, so a single shared claim deadlocks every replica beyond
        # the first node in Multi-Attach errors (ScaledObject allows up to 4).
        # Cost: each new pod cold-downloads the model from HuggingFace before
        # becoming Ready (the startupProbe budgets 10 min for model
        # load). If cold-start time becomes the bottleneck, bake the weights
        # into the image or move to RWX storage — do not share one RWO claim.
        - name: model-cache
          ephemeral:
            volumeClaimTemplate:
              metadata:
                labels:
                  app: vllm-inference
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: gp3   # patched to "standard" in dev overlay
                resources:
                  requests:
                    storage: 50Gi
