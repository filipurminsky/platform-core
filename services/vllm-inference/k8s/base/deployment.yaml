apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  labels:
    app: vllm-inference
    app.kubernetes.io/name: vllm-inference
spec:
  revisionHistoryLimit: 3
  replicas: 0                  # KEDA manages; starts at zero
  selector:
    matchLabels:
      app: vllm-inference
  template:
    metadata:
      labels:
        app: vllm-inference
        app.kubernetes.io/name: vllm-inference
    spec:
      serviceAccountName: vllm-inference
      # seccomp only: the upstream vllm/vllm-openai GPU image is not yet verified to
      # run non-root, so runAsNonRoot is deliberately omitted here. This is the one
      # workload that does not meet the PSS `restricted` profile — hence the apps
      # namespace enforces `baseline` and only warns/audits `restricted`.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      runtimeClassName: nvidia    # patched out in dev overlay (no GPU)
      nodeSelector:
        role: gpu                 # patched out in dev overlay
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule      # removed in dev overlay
      initContainers:
        - name: model-cache-check
          image: busybox:1.36
          command: [sh, -c, "ls /model-cache || echo 'Cold start: model will be downloaded'"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.4.2
          imagePullPolicy: IfNotPresent
          args:
            - "--model"
            - "mistralai/Mistral-7B-Instruct-v0.2"   # patched by overlay
            - "--download-dir"
            - "/model-cache"
            - "--dtype"
            - "auto"
            - "--max-model-len"
            - "4096"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: token
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30    # allow up to 5 min for model load
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"   # patched to 0 in dev overlay
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"   # patched to 0 in dev overlay
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        # Per-pod generic ephemeral volume, NOT a shared PVC: gp3/EBS is
        # ReadWriteOnce, so a single shared claim deadlocks every replica beyond
        # the first node in Multi-Attach errors (ScaledObject allows up to 4).
        # Cost: each new pod cold-downloads the model from HuggingFace before
        # becoming Ready (readiness failureThreshold already budgets for model
        # load). If cold-start time becomes the bottleneck, bake the weights
        # into the image or move to RWX storage — do not share one RWO claim.
        - name: model-cache
          ephemeral:
            volumeClaimTemplate:
              metadata:
                labels:
                  app: vllm-inference
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: gp3   # patched to "standard" in dev overlay
                resources:
                  requests:
                    storage: 50Gi
