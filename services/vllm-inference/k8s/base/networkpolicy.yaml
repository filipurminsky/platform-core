apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-inference
spec:
  podSelector:
    matchLabels:
      app: vllm-inference
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # Both selectors in the same `from` element = AND: only llm-gateway pods
        # in the apps namespace.  Two separate elements would be OR and would let
        # any pod in the apps namespace reach vLLM directly (contract §6 forbids it).
        - podSelector:
            matchLabels:
              app: llm-gateway
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
      ports:
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
  egress:
    - {}    # allow HuggingFace downloads, DNS
