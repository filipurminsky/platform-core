apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-inference
spec:
  podSelector:
    matchLabels:
      app: vllm-inference
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # Both selectors in the same `from` element = AND: only llm-gateway pods
        # in the apps namespace.  Two separate elements would be OR and would let
        # any pod in the apps namespace reach vLLM directly (contract §6 forbids it).
        - podSelector:
            matchLabels:
              app: llm-gateway
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
      ports:
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
  egress:
    # HuggingFace model/tokenizer downloads over HTTPS at startup. AWS endpoints
    # vary by region, so this can't be IP-pinned tighter than 443.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
    # DNS to CoreDNS only.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
