apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/part-of: platform-core
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false

patches:
  - path: patch-vllm-model.yaml
    target:
      kind: Deployment
      name: vllm-inference
  - path: patch-vllm-pvc.yaml
    target:
      kind: PersistentVolumeClaim
      name: vllm-model-cache

replicas:
  - name: vllm-inference
    count: 0
