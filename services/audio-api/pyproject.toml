[project]
name = "audio-api"
version = "0.1.0"
description = "FastAPI service that accepts audio uploads, stores to S3, and produces audio.jobs Kafka events."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.33",
    "confluent-kafka==2.16.1",
    "boto3==1.43.126",
    "redis==8.1.0",
    "prometheus-client==0.26.0",
    "structlog==26.1.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "pydantic-settings==2.16.2",
]

[dependency-groups]
# Test-only deps. uv installs the `dev` group by default on `uv sync`.
dev = [
    # The cross-service suite imports llm-worker's httpx client.
    "httpx==0.28.1",
    "pytest==9.2.0",
    "httpx2==2.16.0",
]

[tool.uv]
# Flat single-module app (main.py), not an installable package — sync deps only.
package = false

# Ruff config is inherited from the repo-root pyproject.toml.
