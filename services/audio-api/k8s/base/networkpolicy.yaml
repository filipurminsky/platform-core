apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audio-api
spec:
  podSelector:
    matchLabels:
      app: audio-api
  policyTypes: [Ingress, Egress]
  ingress:
    # External traffic via ingress-nginx and Prometheus scraping /metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
  egress:
    # Kafka bootstrap (platform namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
    # Redis (platform namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
      ports:
        - port: 6379
          protocol: TCP
    # MinIO (platform namespace, dev) and S3 (prod, via 0.0.0.0/0 on 443)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
      ports:
        - port: 9000
          protocol: TCP
    # OTLP span export to the in-cluster collector (monitoring namespace).
    # Without this rule Cilium (dev) silently drops every exported span and the
    # cross-service trace breaks at this hop.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 4317
          protocol: TCP
    # S3 in prod via HTTPS
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
