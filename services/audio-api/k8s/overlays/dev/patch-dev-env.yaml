# Dev environment: wire MinIO as S3 backend and add MinIO credentials.
# In prod these are absent (IRSA provides AWS credentials; S3_ENDPOINT_URL is unset).
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: S3_ENDPOINT_URL
    value: http://minio.platform.svc.cluster.local:9000

# NB: S3_BUCKET is already set in the base deployment (its dev value is correct),
# so it is NOT re-added here — a duplicate env key breaks server-side-apply updates.

- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: minio-credentials
        key: rootUser

- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: minio-credentials
        key: rootPassword
