# IRSA — prod S3 object access for the audio pipeline (no static keys).
# Role provisioned by terraform/modules/iam (module.irsa_audio_pipeline); the
# account id below is the same placeholder as the ECR registry in
# kustomization.yaml — substitute both from `terraform output
# audio_pipeline_role_arn` when targeting a real account.
- op: add
  path: /metadata/annotations
  value:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/platform-core-prod-audio-pipeline
