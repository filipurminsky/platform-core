# Materializes the audio-api bearer token from AWS Secrets Manager into the
# audio-api-auth Secret that the Deployment's API_TOKEN env reads (see
# patch-prod-env.yaml). Uses the cluster-wide aws-secrets-manager store
# (kubernetes/platform/external-secrets-config). The Secrets Manager path
# follows the convention the external-secrets IAM policy is scoped to:
# <project>/<environment>/* (terraform/modules/iam).
#
# Seed the secret once per account:
#   aws secretsmanager create-secret --name platform-core/prod/audio-api \
#     --secret-string '{"token":"<generated token>"}'
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: audio-api-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: audio-api-auth
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: platform-core/prod/audio-api
        property: token
