# Prod environment: API auth token, Kafka SASL credentials (Strimzi KafkaUser
# Secret), S3 bucket from Crossplane connection secret, no S3_ENDPOINT_URL
# (real AWS S3).
#
# Strategic-merge patch: env vars are merged by `name` (Kubernetes list-map key),
# so adding/removing/reordering env vars in the base deployment is safe — no
# positional index to update here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-api
spec:
  template:
    spec:
      containers:
        - name: audio-api
          env:
            # API auth — bearer token from the audio-api-auth Secret (materialized by
            # the ExternalSecret in this overlay from AWS Secrets Manager). Without
            # API_TOKEN the app skips auth; app/config.py also refuses to start when
            # ENVIRONMENT=prod and API_TOKEN is empty, so prod fails closed either way.
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: audio-api-auth
                  key: token
            # Kafka SASL — credentials from the Strimzi-managed KafkaUser Secret.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: platform-kafka-kafka-bootstrap.platform.svc.cluster.local:9093
            - name: KAFKA_SASL_USERNAME
              value: audio-api
            - name: KAFKA_SECURITY_PROTOCOL
              value: SASL_SSL
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audio-api
                  key: password
            - name: KAFKA_SSL_CA_LOCATION
              value: /mnt/kafka-certs/ca.crt
            # S3 — bucket name from the Crossplane connection secret; no endpoint
            # override (real AWS).  Replaces the base placeholder values by name.
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: audio-pipeline-conn
                  key: bucket
            - name: S3_REGION
              value: eu-west-1
