apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stt-worker
spec:
  podSelector:
    matchLabels:
      app: stt-worker
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
      ports:
        - port: 9092    # Kafka plain
        - port: 9093    # Kafka TLS
        - port: 6379    # Redis
        - port: 9000    # MinIO (dev) / internal S3-compatible storage
    # OTLP span export to the in-cluster collector (monitoring namespace).
    # Without this rule Cilium (dev) silently drops every exported span and the
    # cross-service trace breaks at this hop.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 4317
          protocol: TCP
    # Prod S3 HTTPS — AWS S3 endpoints; no IP restriction (regional endpoints vary)
    - ports:
        - port: 443
          protocol: TCP
    # DNS to CoreDNS only (not unrestricted :53 egress)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
