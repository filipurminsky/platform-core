apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-worker
  labels:
    app: stt-worker
    app.kubernetes.io/name: stt-worker
spec:
  revisionHistoryLimit: 3
  replicas: 0                  # KEDA manages replica count; starts at zero
  selector:
    matchLabels:
      app: stt-worker
  template:
    metadata:
      labels:
        app: stt-worker
        app.kubernetes.io/name: stt-worker
    spec:
      serviceAccountName: stt-worker
      terminationGracePeriodSeconds: 60    # allow in-flight jobs to drain
      # NOTE: no GPU scheduling here. The NeMo (STT_BACKEND=nemo) path requires
      # an image that bakes nemo/torch (the commented `nemo` stage in the
      # Dockerfile) — that image is not built by CI yet, so every environment
      # runs the stub backend on CPU. When the GPU image pipeline lands, add a
      # prod-only patch that sets STT_BACKEND=nemo plus runtimeClassName: nvidia,
      # nodeSelector role=gpu, the nvidia.com/gpu toleration, and GPU resources.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stt-worker
          image: stt-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: env-config
                  optional: true
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: env-config
                  optional: true
                  key: LOG_LEVEL
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: platform-kafka-kafka-bootstrap.platform.svc.cluster.local:9092
            - name: KAFKA_TOPIC_IN
              value: audio.jobs
            - name: KAFKA_TOPIC_OUT
              value: audio.transcripts
            - name: KAFKA_DLQ_TOPIC
              value: audio.stt-dlq
            - name: KAFKA_CONSUMER_GROUP
              value: stt-worker
            # STT backend — stub everywhere until the GPU image pipeline exists.
            # Do NOT set this to `nemo` unless the running image actually bakes
            # nemo/torch (Dockerfile `nemo` stage): the lazy import fails at the
            # first message and every job dead-letters.
            - name: STT_BACKEND
              value: stub
            # OpenTelemetry — extract trace context from Kafka headers, emit span per job
            - name: OTEL_SERVICE_NAME
              value: stt-worker
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=apps
            # S3 object storage (§4) — dev overlay adds S3_ENDPOINT_URL + MinIO creds
            - name: S3_BUCKET
              value: audio-pipeline
            - name: S3_REGION
              value: eu-west-1
            # Redis job-state store (§5)
            - name: REDIS_URL
              value: redis://redis.platform.svc.cluster.local:6379/0
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - name: JOB_STATE_TTL_SECONDS
              value: "604800"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # CPU sizing for the stub backend; the future nemo prod patch replaces
          # this with GPU requests (nvidia.com/gpu: 1, 4-8Gi memory).
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
