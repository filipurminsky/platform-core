apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/part-of: platform-core
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false

patches:
  - path: patch-dev.yaml
    target:
      kind: Deployment
      name: stt-worker

replicas:
  - name: stt-worker
    count: 0

# env-config (ENVIRONMENT/LOG_LEVEL) is a single namespace-wide ConfigMap owned
# by the worker-service Application; this app only references it via the
# Deployment's configMapKeyRef. Re-generating an identically-named ConfigMap here
# makes multiple ArgoCD Applications contend for apps/env-config (perpetual
# OutOfSync) — one owner, many readers.

images:
  - name: stt-worker
    newTag: latest
