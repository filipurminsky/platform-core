# Dev patches for stt-worker Deployment:
#   1. Set dev S3 env (MinIO endpoint + credentials)
#   2. Reduce resources for local kind cluster
#
# The base is already CPU/stub (no GPU scheduling, STT_BACKEND=stub), so dev no
# longer strips GPU fields or switches the backend.

# Append dev S3 MinIO endpoint URL
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: S3_ENDPOINT_URL
    value: http://minio.platform.svc.cluster.local:9000

- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: minio-credentials
        key: rootUser

- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: minio-credentials
        key: rootPassword

# Reduce resources — kind cluster is CPU/memory constrained
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
