# Prod S3: bucket name from Crossplane connection secret, region eu-west-1.
# No S3_ENDPOINT_URL in prod (AWS SDK default endpoint via IRSA).
# Strategic-merge patch: the `name` field is the merge key, so inserting env
# vars in the base deployment never silently rewires these to the wrong index.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-worker
spec:
  template:
    spec:
      containers:
        - name: stt-worker
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: audio-pipeline-conn
                  key: bucket
            - name: S3_REGION
              value: eu-west-1
