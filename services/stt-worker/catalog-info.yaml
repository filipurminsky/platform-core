  annotations:
    github.com/project-slug: filipurminsky/platform-core
    backstage.io/techdocs-ref: dir:.
  tags:
    - python
    - kafka
    - keda
    - stt
    - audio
    - demo
  links:
    - url: https://github.com/filipurminsky/platform-core/tree/main/services/stt-worker
      title: Source
      icon: github
spec:
  type: service
  lifecycle: experimental
  owner: group:platform-team
  system: platform-core
  consumesApis:
    - audio-jobs-topic
  providesApis:
    - audio-transcripts-topic
