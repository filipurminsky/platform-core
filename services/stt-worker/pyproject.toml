[project]
name = "stt-worker"
version = "0.2.0"
description = "STT Kafka worker: consume audio.jobs → transcribe → produce audio.transcripts. Pluggable backend (stub|nemo); nemo is GPU-only and lazy-imported."
requires-python = ">=3.13"
dependencies = [
    "platform-common[audio]",
    "boto3==1.43.124",
    "confluent-kafka==2.16.1",
    "opentelemetry-api==1.45.2",
    "prometheus-client==0.26.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "redis==8.1.0",
]

[dependency-groups]
# Test-only deps. uv installs the `dev` group by default on `uv sync`.
dev = [
    "pytest==9.2.0",
]

[tool.uv]
# Flat single-module app (main.py), not an installable package — sync deps only.
package = false

[tool.uv.sources]
# Shared worker library (services/platform-common). Editable for local dev; the
# Docker build installs it non-editable (uv sync --no-editable).
platform-common = { path = "../platform-common", editable = true }

# NOTE: nemo_toolkit / torch / numpy (and the ffmpeg binary) are NOT listed here.
# The stub backend (STT_BACKEND=stub) needs no ML deps — keeps the image light
# and tests fast. The GPU image bakes them via the Dockerfile `nemo` stage.

# Ruff config is inherited from the repo-root pyproject.toml.
