apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/part-of: platform-core
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false

patches:
  - path: patch-echo-resources.yaml
    target:
      kind: Rollout
      name: echo-service

# Pinned by immutable digest on promotion: docker-build.yaml runs
# `kustomize edit set image echo-service=<repo>@sha256:<digest>`. Never ':latest'
# in prod — Kyverno disallow-latest-tag is Enforce here. Until the first
# promotion this 'unpromoted' tag is un-pullable, so an un-promoted prod fails
# closed (ImagePullBackOff) instead of silently running a mutable tag.
images:
  - name: echo-service
    newName: 123456789.dkr.ecr.eu-west-1.amazonaws.com/platform-core/echo-service
    newTag: unpromoted
