apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: echo-service
spec:
  podSelector:
    matchLabels:
      app: echo-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
  egress:
    - {}
