# Stable ingress. Argo Rollouts clones this into "echo-service-echo-service-canary"
# and adjusts the canary weight annotation as the rollout progresses.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo-service
  labels:
    app: echo-service
    app.kubernetes.io/part-of: platform-core
spec:
  ingressClassName: nginx
  rules:
    - host: echo.platform-core.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo-service
                port:
                  number: 80
