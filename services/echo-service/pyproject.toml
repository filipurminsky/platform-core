[project]
name = "echo-service"
version = "0.1.0"
description = "FastAPI HTTP demo service (probes, metrics, request echo)."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-sdk==1.45.2",
    "prometheus-client==0.26.0",
    "structlog==26.1.0",
    "pydantic-settings==2.16.2",
]

[dependency-groups]
# Test-only deps. uv installs the `dev` group by default on `uv sync`.
# httpx2 is required by Starlette's TestClient (successor to httpx), not at runtime.
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.0",
]

[tool.uv]
# Flat single-module app (main.py), not an installable package — sync deps only.
package = false

# Ruff config is inherited from the repo-root pyproject.toml.
