# Dev environment overrides:
#   - S3 pointed at in-cluster MinIO (path-style, bucket audio-pipeline)
#   - Redis pointed at dev Redis in platform namespace
#
# TTS_BACKEND is already `stub` in the base (the kokoro image pipeline doesn't
# exist yet), so dev no longer overrides it.

# MinIO endpoint (dev; unset in prod)
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: S3_ENDPOINT_URL
    value: http://minio.platform.svc.cluster.local:9000

# NB: S3_BUCKET and REDIS_URL are already set in the base deployment (their dev
# values are correct as-is), so they are NOT re-added here — appending them would
# create duplicate env keys that server-side apply rejects.

- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: minio-credentials
        key: rootUser

- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: minio-credentials
        key: rootPassword
