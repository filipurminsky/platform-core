apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts-worker
  labels:
    app: tts-worker
    app.kubernetes.io/name: tts-worker
spec:
  revisionHistoryLimit: 3
  replicas: 0                  # KEDA manages replica count; starts at zero (scale-to-zero)
  selector:
    matchLabels:
      app: tts-worker
  template:
    metadata:
      labels:
        app: tts-worker
        app.kubernetes.io/name: tts-worker
    spec:
      serviceAccountName: tts-worker
      # Allow in-flight TTS jobs to finish before SIGKILL; Kokoro CPU synthesis
      # can take a few seconds per utterance — 60s is sufficient.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tts-worker
          image: tts-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: env-config
                  optional: true
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: env-config
                  optional: true
                  key: LOG_LEVEL

            # Kafka
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: platform-kafka-kafka-bootstrap.platform.svc.cluster.local:9092
            - name: KAFKA_TOPIC_IN
              value: audio.summaries
            - name: KAFKA_TOPIC_OUT
              value: audio.results
            - name: KAFKA_DLQ_TOPIC
              value: audio.tts-dlq
            - name: KAFKA_CONSUMER_GROUP
              value: tts-worker

            # TTS backend — stub everywhere until the Kokoro image pipeline exists.
            # Do NOT set this to `kokoro` unless the running image actually bakes
            # the kokoro/torch deps (they are intentionally absent from
            # pyproject.toml/uv.lock): the lazy import fails at the first message
            # and every job dead-letters.
            - name: TTS_BACKEND
              value: stub

            # OpenTelemetry
            - name: OTEL_SERVICE_NAME
              value: tts-worker
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=apps

            # S3 (bucket name and region; endpoint set in dev overlay for MinIO)
            - name: S3_BUCKET
              value: audio-pipeline
            - name: S3_REGION
              value: eu-west-1

            # Redis
            - name: REDIS_URL
              value: redis://redis.platform.svc.cluster.local:6379/0
            - name: JOB_STATE_TTL_SECONDS
              value: "604800"

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          # Kokoro CPU synthesis is compute-heavier than STT/LLM workers; 2 CPU cores
          # and 2Gi RAM allow full-utterance synthesis of meeting-length audio in time.
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

          securityContext:
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem is intentionally false: Kokoro may write model
            # temp files and scratch data to /tmp during CPU inference.
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
