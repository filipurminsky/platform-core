replicaCount: 2

image:
  repository: ""          # required — set per environment (templating fails if unset)
  tag: ""                 # defaults to the chart appVersion; never ":latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Gateway API HTTPRoute (Envoy Gateway). Off by default — a generic chart has
# no hostname to claim; set hostnames per service when enabling. parentRefs
# default to the shared platform Gateway (the platform-wide contract).
httpRoute:
  enabled: false
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames: []
  path: /
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # Deny all ingress except from the Gateway data plane and monitoring.
  # Envoy Gateway runs its Envoy proxy pods in the controller namespace by default.
  gatewayNamespace: envoy-gateway-system

livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s

podAntiAffinity:
  enabled: true       # spread replicas across nodes

serviceAccount:
  create: true
  annotations: {}     # add eks.amazonaws.com/role-arn for IRSA
