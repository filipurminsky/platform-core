{{- if .Values.kubernetes.enabled }}
# Read-only cluster access for the Backstage Kubernetes plugin: enough to render
# live workload status per catalog component, nothing mutating.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "backstage.fullname" . }}-k8s-reader
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, limitranges, resourcequotas, events]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "backstage.fullname" . }}-k8s-reader
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "backstage.fullname" . }}-k8s-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "backstage.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Stable ServiceAccount token (k8s 1.24+ no longer auto-creates these). Exposed
# to the backend as K8S_SA_TOKEN; the kubernetes plugin uses it to reach the API.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backstage.fullname" . }}-k8s-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "backstage.serviceAccountName" . }}
type: kubernetes.io/service-account-token
{{- end }}
