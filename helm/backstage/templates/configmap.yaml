{{- if and .Values.auth.guest.enabled (ne .Values.environment "dev") }}
{{- fail "guest authentication is permitted only with environment=dev" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backstage.fullname" . }}-config
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
data:
  app-config.local.yaml: |
    app:
      title: {{ .Values.app.title | quote }}
      baseUrl: {{ .Values.app.baseUrl | quote }}

    organization:
      name: Platform Core

    backend:
      baseUrl: {{ .Values.app.backendBaseUrl | quote }}
      listen:
        host: 0.0.0.0
        port: 7007
      csp:
        connect-src: ["'self'", "http:", "https:"]
      cors:
        origin: {{ .Values.app.baseUrl | quote }}
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
{{- if .Values.catalog.allowedHosts }}
      reading:
        allow:
{{- range .Values.catalog.allowedHosts }}
          - host: {{ . | quote }}
{{- end }}
{{- end }}
      database:
        client: better-sqlite3
        connection:
          directory: /tmp

    auth:
      environment: {{ ternary "development" "production" (eq .Values.environment "dev") }}
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: {{ .Values.auth.guest.enabled }}
          userEntityRef: user:default/guest

    integrations:
      github:
        - host: github.com
{{- if .Values.github.tokenSecret }}
          token: ${GITHUB_TOKEN}
{{- end }}

    catalog:
      rules:
        - allow: [Component, System, API, Resource, Group, User, Template, Location]
      locations:
        - type: file
          target: /app/catalog/entities.yaml
        - type: file
          target: /app/catalog/components.yaml
        # Self-service scaffolder templates — loaded from Git so each template's
        # skeleton resolves relative to its template.yaml. Public repo, so the
        # unauthenticated GitHub integration can read them.
        - type: url
          target: {{ .Values.catalog.templateBaseUrl }}/microservice/template.yaml
          rules:
            - allow: [Template]
        - type: url
          target: {{ .Values.catalog.templateBaseUrl }}/platform-app/template.yaml
          rules:
            - allow: [Template]
        - type: url
          target: {{ .Values.catalog.templateBaseUrl }}/llm-service/template.yaml
          rules:
            - allow: [Template]

    techdocs:
      builder: local
      generator:
        runIn: local
      publisher:
        type: local
{{- if .Values.kubernetes.enabled }}

    # Kubernetes plugin — live pod/deployment status per catalog component
    # (matched via the backstage.io/kubernetes-id annotation). The stock image
    # ships the kubernetes backend; RBAC + a SA token are provided by rbac.yaml.
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: {{ .Values.kubernetes.clusterName | default "local" }}
              url: {{ .Values.kubernetes.url | default "https://kubernetes.default.svc" }}
              authProvider: serviceAccount
              skipTLSVerify: true
              skipMetricsLookup: {{ .Values.kubernetes.skipMetricsLookup }}
              serviceAccountToken: ${K8S_SA_TOKEN}
{{- end }}
{{- if .Values.argocd.enabled }}

    # ArgoCD plugin — requires a custom image (frontend plugin not in stock).
    argocd:
      appLocatorMethods:
        - type: config
          instances:
            - name: in-cluster
              url: {{ .Values.argocd.url | quote }}
{{- end }}
{{- if .Values.grafana.enabled }}

    # Grafana plugin — requires a custom image (frontend plugin not in stock).
    grafana:
      domain: {{ .Values.grafana.url | quote }}
      unifiedAlerting: false
{{- end }}
{{- if or .Values.argocd.enabled .Values.grafana.enabled }}

    proxy:
      endpoints:
{{- if .Values.argocd.enabled }}
        "/argocd/api":
          target: {{ .Values.argocd.url | quote }}
          changeOrigin: true
          secure: false
          headers:
            Cookie: ${ARGOCD_AUTH_TOKEN}
{{- end }}
{{- if .Values.grafana.enabled }}
        "/grafana/api":
          target: {{ .Values.grafana.url | quote }}
          headers:
            Authorization: Bearer ${GRAFANA_TOKEN}
{{- end }}
{{- end }}

  entities.yaml: |
{{ .Files.Get "files/catalog/entities.yaml" | indent 4 }}
  components.yaml: |
{{ .Files.Get "files/catalog/components.yaml" | indent 4 }}
