apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: echo-service
  description: HTTP echo service demonstrating GitOps delivery, canary rollout, and SLO analysis
  tags: [python, fastapi, demo]
  annotations:
    github.com/project-slug: filipurminsky/platform-core
    argocd/app-name: echo-service
    prometheus.io/rule: echo-service
    grafana/dashboard-selector: app=echo-service
    backstage.io/kubernetes-id: echo-service
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: platform-core
  providesApis:
    - echo-api
---
