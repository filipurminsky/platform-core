# Default chart renders keep guest authentication disabled. The environment-selected
# ApplicationSet supplies values-dev.yaml only for clusters labelled dev.
environment: prod
auth:
  guest:
    enabled: false

# Optional credential for GitHub catalog reads and scaffolder publishing.
# Supply a reviewed Kubernetes Secret; no credential is stored in values.
github:
  tokenSecret: ""
  tokenKey: token

# Defaults read the published GitHub revision. QA can point catalog reads at a
# local source snapshot with an explicit URL-reader allowlist.
catalog:
  templateBaseUrl: https://github.com/filipurminsky/platform-core/blob/main/backstage/templates
  allowedHosts: []

replicaCount: 1

image:
  repository: ghcr.io/backstage/backstage
  tag: "1.55.2"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 7007
  targetPort: http

# Gateway API HTTPRoute (Envoy Gateway) — the default exposure path. Attaches
# to the shared platform Gateway; that Gateway's listener must allow routes
# from this release's namespace.
httpRoute:
  enabled: true
  # GitHub tree fetches in synchronous scaffolder dry-runs exceeded Envoy's
  # default 15s request deadline in live QA. Keep a bounded portal-only budget.
  requestTimeout: 120s
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames:
    - backstage.platform-core.local
  annotations: {}

# Legacy networking.k8s.io Ingress — off by default (ingress-nginx is being
# replaced by Envoy Gateway). Kept only for clusters still on an Ingress
# controller; don't enable alongside httpRoute unless migrating.
ingress:
  enabled: false
  className: nginx
  host: backstage.platform-core.local
  annotations: {}

app:
  title: Platform Core
  baseUrl: http://backstage.platform-core.local
  backendBaseUrl: http://backstage.platform-core.local

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi

livenessProbe:
  httpGet:
    path: /.backstage/health/v1/liveness
    port: http
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /.backstage/health/v1/readiness
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 12

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "7007"

nodeSelector: {}
tolerations: []
affinity: {}

# ─── Plugins ──────────────────────────────────────────────────────────────────
# Kubernetes plugin — live workload status per catalog component. Works with the
# stock Backstage image (kubernetes backend is bundled). rbac.yaml grants the
# read-only ClusterRole and a stable SA token consumed via K8S_SA_TOKEN.
kubernetes:
  enabled: true
  clusterName: local
  # This platform uses Prometheus and does not install metrics-server. Avoid a
  # broken CPU/memory lookup against the absent metrics.k8s.io API. Disable only
  # after installing that API; RBAC for it is then rendered automatically.
  skipMetricsLookup: true
  url: https://kubernetes.default.svc

# ArgoCD frontend plugin is NOT bundled in the stock image. Enable only with a
# custom image that installs it and a provisioned API token.
argocd:
  enabled: false
  url: https://argocd-server.argocd.svc
  tokenSecret: "argocd-token"

# Grafana frontend plugin also requires a custom image. The standalone Grafana
# UI remains available independently.
grafana:
  enabled: false
  url: http://grafana.monitoring.svc
  tokenSecret: "grafana-token"
