apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vllm.fullname" . }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  replicas: 0                  # KEDA manages replica count
  selector:
    matchLabels:
      {{- include "vllm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vllm.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- if and .Values.gpu.enabled (not .Values.devMode.enabled) }}
      runtimeClassName: {{ .Values.gpu.runtimeClass }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      initContainers:
        - name: model-cache-check
          image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: [sh, -c, "ls /model-cache && echo 'Cache hit' || echo 'Cold start'"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534          # nobody — only lists the cache dir
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
      containers:
        - name: vllm
          image: {{ include "vllm.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--model"
            - {{ include "vllm.modelName" . | quote }}
            - "--revision"
            - {{ .Values.model.revision | quote }}
            - "--download-dir"
            - "/model-cache"
            - "--dtype"
            - {{ ternary .Values.devMode.dtype .Values.model.dtype .Values.devMode.enabled | quote }}
            - "--max-model-len"
            - {{ .Values.model.maxModelLen | quote }}
            {{- if not .Values.devMode.enabled }}
            - "--gpu-memory-utilization"
            - {{ .Values.model.gpuMemoryUtilization | quote }}
            {{- end }}
            - "--port"
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: token
                  optional: true
            - name: HF_HOME
              value: /model-cache/hf
            {{- if .Values.devMode.enabled }}
            - name: VLLM_CPU_KVCACHE_SPACE
              value: {{ .Values.devMode.kvCacheSpaceGiB | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- include "vllm.resources" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
      volumes:
        - name: model-cache
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "vllm.fullname" . }}-model-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
