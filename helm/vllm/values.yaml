# vLLM OpenAI-compatible server (V1 engine). Image entrypoint is `vllm serve`.
image:
  repository: vllm/vllm-openai
  # Empty = v<appVersion>-cu129. CUDA 12.9 build rather than the default CUDA
  # 13.0 tag, which needs NVIDIA driver >= 580 (not on the AL2 GPU AMI).
  tag: ""
  pullPolicy: IfNotPresent

model:
  name: "mistralai/Mistral-7B-Instruct-v0.2"
  revision: main
  huggingfaceToken: ""     # set via External Secrets / env var HF_TOKEN
  dtype: auto              # auto | float16 | bfloat16
  maxModelLen: 4096
  gpuMemoryUtilization: "0.90"   # fraction of GPU memory for weights + KV cache

gpu:
  enabled: true
  count: 1                 # nvidia.com/gpu request
  runtimeClass: nvidia

resources:
  requests:
    cpu: "2"
    memory: 8Gi
    nvidia.com/gpu: 1
  limits:
    cpu: "4"
    memory: 16Gi
    nvidia.com/gpu: 1

# Dev / CPU mode. The CUDA image cannot run on CPU and `--device cpu` no longer
# exists (platform is auto-detected), so devMode switches to the dedicated CPU
# image and drops GPU scheduling.
devMode:
  enabled: false
  model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  image:
    repository: vllm/vllm-openai-cpu
    tag: ""                # empty = v<appVersion>
  dtype: bfloat16          # fp32 TinyLlama (~4.4 GiB) would not fit the limit below
  kvCacheSpaceGiB: "1"     # VLLM_CPU_KVCACHE_SPACE
  resources:
    requests:
      cpu: "1"
      memory: 3Gi
    limits:
      cpu: "2"
      memory: 5Gi

persistence:
  enabled: true
  size: 50Gi               # cache model weights; avoids re-download on pod restart
  storageClass: gp3        # override to "standard" in dev

service:
  type: ClusterIP
  port: 8000

# Node affinity for GPU nodes
nodeSelector:
  role: gpu

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

# Probes — vLLM only listens once the model is loaded; the startupProbe budgets
# 10 min for download + load so liveness/readiness can stay tight.
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  failureThreshold: 60

readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /health          # 503 once the engine core is dead
    port: http
  periodSeconds: 30
  failureThreshold: 5

# CUDA_VISIBLE_DEVICES is intentionally not set: the NVIDIA device plugin
# injects the allocated GPU(s); hard-coding "0" breaks multi-GPU requests.
extraEnv:
  - name: VLLM_WORKER_MULTIPROC_METHOD
    value: spawn
