# Trivy misconfiguration ignore list.
#
# Every entry below is a deliberate, reviewed exception — not a blanket mute.
# Wired into CI via `--ignorefile .trivyignore.yaml` on the trivy-iac job in
# .github/workflows/ci.yaml (the .yaml extension selects Trivy's structured,
# path-scoped parser). Trivy >= 0.6x reports IDs as e.g. KSV-0014; the legacy
# AVD-KSV-0014 form used below is still matched as an alias.
# Findings that CAN be fixed in-repo are fixed in the manifests, not listed here.

misconfigurations:
  # KSV014 (readOnlyRootFilesystem) — GPU model-serving containers write model
  # weights, HuggingFace metadata and Torch/Triton compile caches to $HOME and
  # /tmp at runtime, so an immutable root filesystem would break model loads.
  # vLLM is already special-cased for GPU/privilege in .kube-linter.yaml; the
  # same exception is accepted here. stt-worker (NeMo Parakeet) and tts-worker
  # (Kokoro) are the same class of workload — they write runtime scratch/model
  # caches and carry the same documented readOnlyRootFilesystem: false. The
  # busybox init container in these files IS hardened (readOnlyRootFilesystem:
  # true) — only the serving container is exempted.
  - id: AVD-KSV-0014
    paths:
      - "helm/vllm/templates/deployment.yaml"
      - "services/vllm-inference/k8s/base/deployment.yaml"
      - "services/stt-worker/k8s/base/deployment.yaml"
      - "services/tts-worker/k8s/base/deployment.yaml"

  # KSV053 (no pods/exec) & KSV056 (no service/network control) — tenant-admin
  # is intentionally a "full control over workload resources" role: teams need
  # kubectl exec/port-forward to debug their pods and must manage their own
  # Services and Ingresses. The platform-owned guardrails (ResourceQuota,
  # LimitRange, NetworkPolicy, RBAC) remain read-only to tenants — that is the
  # boundary that actually matters, and it is enforced.
  - id: AVD-KSV-0053
    paths:
      - "kubernetes/tenants/_template/rbac-roles.yaml"
  - id: AVD-KSV-0056
    paths:
      - "kubernetes/tenants/_template/rbac-roles.yaml"

  # KSV112 (don't manage all resources in a namespace) — fires on the
  # tenant-viewer wildcard rule, but its verbs are strictly get/list/watch.
  # The wildcard is intentional so new workload kinds become visible without
  # editing RBAC; no mutating access is granted.
  - id: AVD-KSV-0112
    paths:
      - "kubernetes/tenants/_template/rbac-roles.yaml"

  # KSV109 (secrets stored in ConfigMaps) — false positive. The flagged value
  # `serviceAccountToken: ${K8S_SA_TOKEN}` is a Backstage env-var placeholder
  # interpolated at runtime from the backstage-k8s-token Secret (see the
  # secretKeyRef in helm/backstage/templates/deployment.yaml). No secret
  # material is stored in the ConfigMap.
  - id: AVD-KSV-0109
    paths:
      - "helm/backstage/templates/configmap.yaml"

  # AWS-0164 (subnet auto-assigns public IPs) — intentional cost trade-off.
  # This showcase runs EKS worker nodes in public subnets so they reach the
  # internet directly via the Internet Gateway, which avoids paying for a NAT
  # gateway (enable_nat_gateway = false). Nodes therefore need public IPs
  # (map_public_ip_on_launch = true). Fires inside the upstream
  # terraform-aws-modules/vpc module on aws_subnet.public; accepted as a
  # deliberate design choice, not configurable away without reintroducing NAT.
  - id: AVD-AWS-0164

  # AWS-0130 (IMDSv2 token required) & AWS-0104 (egress to public internet) —
  # both originate inside the upstream terraform-aws-modules/eks module that
  # Trivy downloads and scans; they are not our source and are not configurable
  # from the module call site without forking it. Worker-node egress to the
  # internet is required to pull container images and reach the EKS API.
  # Accepted as third-party module risk.
  - id: AVD-AWS-0130
  - id: AVD-AWS-0104

  # AWS-0057 (least-privilege IAM — no wildcards) — fires on the Crossplane S3
  # provider policy. The wildcard is irreducible here: Crossplane is a
  # provisioning controller that creates/deletes S3 buckets whose names don't
  # exist when the policy is written, so it MUST be scoped by prefix
  # (arn:aws:s3:::platform-core-<env>-*) rather than to exact bucket ARNs — that
  # prefix is already the tightest possible bound. The bucket-config action
  # wildcards (s3:GetBucket*/PutBucket*) cover the versioning/encryption/
  # public-access-block sub-resources the provider reconciles. The role is bound
  # via IRSA to a single ServiceAccount (crossplane-system:provider-aws-s3).
  # The read-only policies in this same module (external-secrets, ecr) do not
  # trip this rule. Scoped to the iam module only.
  - id: AVD-AWS-0057
    paths:
      - "terraform/modules/iam/main.tf"

  # AWS-0057 — also fires inside the upstream Karpenter submodule
  # (terraform-aws-modules/eks//modules/karpenter/policy.tf), which Trivy
  # downloads and scans. The Karpenter controller MUST create/tag/get instance
  # profiles whose names don't exist when the policy is written
  # (iam:*InstanceProfile on instance-profile/*) and call
  # arc-zonal-shift:GetManagedResource on * — these wildcards are irreducible and
  # mirror AWS's own published Karpenter controller policy. Not configurable from
  # our module call site; same accepted-upstream-module-risk basis as
  # AWS-0130/0104 above.
  - id: AVD-AWS-0057
    paths:
      - "**/modules/karpenter/policy.tf"

  # KSV-0118 (default security context) — fires on kustomize strategic-merge
  # PATCH fragments under services/*/k8s/overlays/*/patch-*.yaml. A patch is a
  # partial Deployment (env/volume tweaks) that intentionally omits the pod
  # securityContext; the full hardened securityContext lives in each service's
  # k8s/base manifest, which is scanned (and passes) on its own. Scoped to
  # patch files only — base manifests, Helm templates and Jobs are NOT exempt.
  - id: AVD-KSV-0118
    paths:
      - "services/*/k8s/overlays/*/patch-*.yaml"

  # AWS-0040 (EKS public endpoint enabled) — the DEV cluster deliberately keeps
  # a public API endpoint so a laptop can reach it without a VPN/bastion; it is
  # CIDR-restricted via the required, default-less `api_allowed_cidrs` variable
  # (terraform/environments/dev). Prod defaults to a private-only endpoint
  # (api_public_access = false). The finding is reported inside the upstream
  # terraform-aws-modules/eks module, so it can only be scoped to that file.
  # AWS-0041 (public endpoint open to 0.0.0.0/0) stays ENFORCED, which is the
  # check that catches the dangerous case for either environment.
  - id: AVD-AWS-0040
    paths:
      - "**/terraform-aws-modules/eks/aws/main.tf"
