# Static kind cluster config used by scripts/bootstrap.sh --mode=local.
# (The kind Terraform module can also render this; this committed copy lets the
# bootstrap script run without Terraform.)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform-core
networking:
  # Default CNI (kindnet) is disabled — scripts/bootstrap.sh installs Cilium
  # (eBPF dataplane + Hubble flow visibility) before ArgoCD reconciles. Nodes
  # stay NotReady until Cilium is up, which is why bootstrap.sh creates the
  # cluster without --wait and waits for readiness after the Cilium install.
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
nodes:
  - role: control-plane
    # Pin k8s to 1.35 — the fleet target, matching EKS (terraform/environments/*
    # kubernetes_version). Digest-pinned so local bootstrap is reproducible.
    # This image is from the kind v0.33.0 release notes: use kind >= v0.33.0.
    # Keep component versions (Strimzi, etc.) on releases that support k8s 1.35.
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    # Label + port mappings let Envoy Gateway serve on the host's :80/:443: the
    # envoy proxy pods bind hostPort 80/443 on this ingress-ready node, which the
    # echo-service canary route (echo.platform-core.local) relies on.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
