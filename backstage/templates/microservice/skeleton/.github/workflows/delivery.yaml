name: Test, sign and propose deployment
on:
  pull_request:
  push:
    branches: [main]
    paths: [app/**, test_main.py, pyproject.toml, uv.lock, Dockerfile, .github/**, scripts/**]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: dev
        description: Environment for the verified image promotion PR
permissions: {}
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv lock --check && uv run --frozen pytest -q
        env: {OTEL_SDK_DISABLED: 'true'}
      - name: Validate deployment overlays
        run: |
          set -euo pipefail
          for environment in dev prod; do
            kubectl kustomize "k8s/overlays/$environment" > "/tmp/$environment.yaml"
          done
      - name: Build without publishing
        run: docker build -t service:test .
  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write, id-token: write}
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Registry login
        env: {GH_TOKEN: '${{ github.token }}'}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: ./.github/actions/setup-trivy
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: service:scan
      - run: trivy image --exit-code 1 --severity HIGH,CRITICAL service:scan
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.ref.outputs.image }}:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Scan published variants by immutable digest
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for architecture in amd64 arm64; do
            trivy image --platform "linux/$architecture" --exit-code 1 --severity HIGH,CRITICAL "$IMAGE@$DIGEST"
          done
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with: {cosign-release: v3.1.4}
      - name: Sign only after both variants pass
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
  promotion:
    needs: release
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'development' }}
    permissions: {contents: write, pull-requests: write, packages: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with: {cosign-release: v3.1.4}
      - name: Verify trusted signer and open promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.release.outputs.image }}
          DIGEST: ${{ needs.release.outputs.digest }}
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/delivery.yaml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          python3 scripts/promote.py
          kubectl kustomize "k8s/overlays/$TARGET_ENVIRONMENT" > /tmp/promoted.yaml
          branch="promote/$TARGET_ENVIRONMENT/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "k8s/overlays/$TARGET_ENVIRONMENT/kustomization.yaml"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Promote verified image to $TARGET_ENVIRONMENT"
          gh auth setup-git
          git push origin "$branch"
          printf 'Verified image: `%s@%s`\n\nBoth architectures passed vulnerability scanning. Review before merging.\n' "$IMAGE" "$DIGEST" > /tmp/promotion-body.md
          gh pr create --base main --head "$branch" --title "Promote image to $TARGET_ENVIRONMENT" --body-file /tmp/promotion-body.md
