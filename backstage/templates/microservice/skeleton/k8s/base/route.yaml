apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${{ values.name }}
spec:
  parentRefs: [{name: platform, namespace: envoy-gateway-system}]
  hostnames: ["${{ values.name }}.platform-core.local"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs: [{name: "${{ values.name }}", port: 80}]
