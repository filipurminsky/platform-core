[project]
name = "${{ values.name }}"
version = "0.1.0"
description = "${{ values.description }}"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "prometheus-client==0.20.0",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "httpx==0.27.0",
]

[tool.uv]
# Flat app, not an installable package — sync deps only.
package = false
