# demo-app Helm values for ${{ values.name }}.
# Consumed by the ArgoCD Application in application.yaml.
nameOverride: ${{ values.name }}

image:
  repository: ${{ values.imageRepository }}
  tag: "${{ values.imageTag }}"

replicaCount: 2

service:
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi
