apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: platform-app
  title: New Platform App (GitOps)
  description: |
    Scaffold a GitOps deployment for an existing container image: a demo-app
    Helm values file plus an ArgoCD Application, so the service is delivered the
    moment the PR merges. No application source code — delivery only.
  tags: [recommended, gitops, argocd, helm]
spec:
  owner: platform-team
  type: resource
  parameters:
    - title: Application
      required: [name, owner, imageRepository, imageTag, namespace]
      properties:
        name:
          title: Name
          type: string
          pattern: "^[a-z][a-z0-9-]+$"
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        imageRepository:
          title: Image repository
          type: string
          description: Container image repository, without the tag
        imageTag:
          title: Image tag
          type: string
          default: latest
        namespace:
          title: Target namespace
          type: string
          default: apps
    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]
  steps:
    - id: fetch
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          imageRepository: ${{ parameters.imageRepository }}
          imageTag: ${{ parameters.imageTag }}
          namespace: ${{ parameters.namespace }}
    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
