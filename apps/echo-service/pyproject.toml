[project]
name = "echo-service"
version = "0.1.0"
description = "FastAPI HTTP demo service (probes, metrics, request echo)."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "opentelemetry-api==1.29.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "opentelemetry-sdk==1.29.0",
    "prometheus-client==0.20.0",
    "structlog==24.1.0",
    "pydantic-settings==2.14.1",
]

[dependency-groups]
# Test-only deps. uv installs the `dev` group by default on `uv sync`.
# httpx is required by Starlette's TestClient, not at runtime.
dev = [
    "pytest==8.2.0",
    "httpx==0.27.0",
]

[tool.uv]
# Flat single-module app (main.py), not an installable package — sync deps only.
package = false

# Ruff config is inherited from the repo-root pyproject.toml.
