checks:
  # Curated security baseline — only the checks in `include` below run.
  # (Previously `true`, which contradicts an explicit include list and pulls in
  # noisy checks like dangling-networkpolicy/wildcard-in-rules on tenant manifests.)
  addAllBuiltIn: false
  exclude:
    # vLLM legitimately needs privileged GPU access; exclude it from this check
    - "privilege-escalation-container"
  include:
    - "require-part-of-label"
    - "unset-cpu-requirements"
    - "unset-memory-requirements"
    - "no-liveness-probe"
    - "no-readiness-probe"
    - "no-read-only-root-fs"
    - "run-as-non-root"
    - "drop-net-raw-capability"

customChecks:
  # Renamed from "required-label-owner" — that name now collides with a
  # built-in check in newer kube-linter releases (duplicate check name).
  - name: "require-part-of-label"
    template: "required-label"
    # Scope to workloads — Roles, NetworkPolicies, ResourceQuotas and
    # LimitRanges legitimately don't carry an app part-of label.
    scope:
      objectKinds:
        - DeploymentLike
    params:
      key: "app.kubernetes.io/part-of"

ignoreFields:
  # Strimzi-generated pods use root; ignore operator-managed resources
  - objectMatcher:
      namespaces: ["platform"]
      apiGroups: ["kafka.strimzi.io"]
    fieldMatchers:
      - "run-as-non-root"
      - "privilege-escalation-container"
