# Pre-commit hooks for platform-core. Mirrors the fast layer of CI so problems
# surface locally instead of after a push (see .github/workflows/ci.yaml).
#
# Setup (one-time):
#   uvx pre-commit install                 # wires the commit + push hooks
# Run manually:
#   uvx pre-commit run --all-files
#
# Tiering: fast, universally-available checks run on every commit; the slower
# test suite runs on pre-push. Manifest validation (kubeconform/conftest/helm/
# kyverno) is intentionally left to CI to avoid requiring those CLIs locally.
default_install_hook_types: [pre-commit, pre-push]

repos:
  # ── File hygiene ──────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Helm chart templates and the Backstage scaffolder skeleton contain
        # Go/Jinja templating that is not valid standalone YAML.
        exclude: ^(helm/[^/]+/templates/|backstage/templates/)

  # ── Secret scanning ───────────────────────────────────────────────────────
  # Blocks commits that introduce credentials, keys or tokens. Scans only the
  # staged diff on commit (fast); CI re-runs gitleaks over full history.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── Python: ruff lint + format (config in repo-root pyproject.toml) ─────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ── Terraform formatting ──────────────────────────────────────────────────
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.106.0
    hooks:
      - id: terraform_fmt

  # ── Local hooks (need uv on PATH) ─────────────────────────────────────────
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv.lock in sync with pyproject.toml
        entry: bash -c 'for a in services/echo-service services/worker-service services/llm-gateway services/audio-api services/stt-worker services/llm-worker services/tts-worker; do (cd "$a" && uv lock --check) || exit 1; done'
        language: system
        files: ^services/.*/(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: pytest
        name: app unit tests (uv run pytest)
        entry: bash -c 'for a in services/echo-service services/worker-service services/llm-gateway services/audio-api services/stt-worker services/llm-worker services/tts-worker; do echo "== $a =="; (cd "$a" && uv run --frozen pytest -q) || exit 1; done'
        language: system
        files: ^services/
        pass_filenames: false
        stages: [pre-push]

      # ── kube-linter (mirrors the kube-linter CI job) ────────────────────────
      # Unlike the other manifest CLIs (kubeconform/conftest/helm/kyverno) we keep
      # in CI only, kube-linter runs here so best-practice regressions — e.g. a PDB
      # missing unhealthyPodEvictionPolicy — surface before push. Requires the
      # kube-linter binary on PATH: https://docs.kubelinter.io (`brew install
      # kube-linter`); the hook fails with that hint if it's missing.
      - id: kube-linter
        name: kube-linter best-practice checks (kubernetes/)
        entry: bash -c 'command -v kube-linter >/dev/null || { echo "kube-linter not on PATH — install it (brew install kube-linter) to run this hook"; exit 1; }; kube-linter lint kubernetes/ --config .kube-linter.yaml'
        language: system
        files: ^kubernetes/.*\.ya?ml$
        pass_filenames: false

      - id: kube-linter-pdb
        name: kube-linter PDB checks (all manifests)
        entry: bash -c 'command -v kube-linter >/dev/null || { echo "kube-linter not on PATH — install it (brew install kube-linter) to run this hook"; exit 1; }; kube-linter lint . --config .kube-linter-pdb.yaml'
        language: system
        files: ^(kubernetes|services|helm)/.*\.ya?ml$
        pass_filenames: false

      # ── Trivy IaC/misconfig scan (mirrors the trivy-iac CI job) ─────────────
      # Pinned to the SAME image CI's trivy-action@v0.20.0 runs
      # (ghcr.io/aquasecurity/trivy:0.51.1) so verdicts match exactly — a locally
      # installed trivy is a different version and flags manifests CI accepts.
      # Requires Docker running (and signed in). Flags mirror the CI job:
      #   --ignorefile .trivyignore.yaml  == CI's TRIVY_IGNOREFILE env var
      #   --skip-dirs .github             == CI's skip-dirs
      # The remaining skips are local-only paths a fresh CI checkout never has, so
      # skipping them keeps the verdict matched to CI:
      #   --skip-dirs **/.terraform/**    == terraform-init vendored modules
      #   --skip-dirs .agents --skip-dirs .claude == untracked agent tooling
      #                                      (e.g. helm-validator's insecure test
      #                                      fixture chart under .agents/skills/).
      - id: trivy-config
        name: trivy IaC + manifest misconfig scan (pinned 0.51.1)
        entry: >-
          ghcr.io/aquasecurity/trivy:0.51.1
          --cache-dir /tmp/trivy-cache
          config --severity HIGH,CRITICAL --exit-code 1
          --ignorefile .trivyignore.yaml
          --skip-dirs .github --skip-dirs **/.terraform/**
          --skip-dirs .agents --skip-dirs .claude
          .
        language: docker_image
        files: (\.ya?ml|\.tf|Dockerfile)$
        pass_filenames: false
