apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

# Base contains real Kubernetes manifests (Deployments, Services).
# ArgoCD Application CRs live separately in kubernetes/apps/.
# Overlays patch these base manifests for dev vs prod.
resources:
  - echo-service/
  - worker-service/
  - vllm-inference/
  - llm-gateway/
  # AI Audio Pipeline (STT → LLM → TTS). ArgoCD deploys the per-app overlays
  # (overlays/{env}/<svc>); these aggregate entries exist so CI's whole-overlay
  # kubeconform + OPA/conftest relationship checks cover the new services too.
  - audio-api/
  - stt-worker/
  - llm-worker/
  - tts-worker/

# Use `labels` with includeSelectors:false, NOT commonLabels.
# commonLabels injects labels into Service/Deployment SELECTORS, but kustomize
# doesn't know the Rollout CRD's selector path — so the echo-service Service
# selector got app.kubernetes.io/managed-by while the Rollout selector didn't,
# which Argo Rollouts rejects ("unmatch label ... in rollout"). Keeping these as
# metadata-only labels avoids polluting selectors.
labels:
  - pairs:
      app.kubernetes.io/part-of: platform-core
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false
