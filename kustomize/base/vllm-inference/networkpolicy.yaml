apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-inference
spec:
  podSelector:
    matchLabels:
      app: vllm-inference
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: llm-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
      ports:
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
  egress:
    - {}    # allow HuggingFace downloads, DNS
