apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-model-cache
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
  labels:
    app: vllm-inference
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3            # patched to "standard" in dev overlay
  resources:
    requests:
      storage: 50Gi
