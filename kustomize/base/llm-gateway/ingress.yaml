apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-gateway
  labels:
    app: llm-gateway
    app.kubernetes.io/part-of: platform-core
spec:
  ingressClassName: nginx
  rules:
    - host: llm-gateway.platform-core.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm-gateway
                port:
                  number: 80
