apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # echo-service is a Rollout (canary) — JSON patch for replicas + prod resources
  - path: patch-echo-resources.yaml
    target:
      kind: Rollout
      name: echo-service

  # worker-service gets more memory for buffering Kafka batches
  - path: patch-worker-resources.yaml
    target:
      kind: Deployment
      name: worker-service

replicas:
  - name: worker-service
    count: 0          # KEDA-managed
  - name: vllm-inference
    count: 0          # KEDA-managed
  # echo-service replicas set via patch-echo-resources.yaml (Rollout — replicas transformer doesn't support it)

configMapGenerator:
  - name: env-config
    literals:
      - ENVIRONMENT=prod
      - LOG_LEVEL=info
generatorOptions:
  disableNameSuffixHash: true

# NOTE: this aggregate overlay exists for CI validation only — ArgoCD deploys the
# per-app overlays (overlays/prod/<app>), which is where docker-build.yaml pins the
# promoted digest. Tags here are placeholders; never ':latest' (disallow-latest-tag
# is Enforce in prod).
images:
  - name: echo-service
    newName: 123456789.dkr.ecr.eu-west-1.amazonaws.com/platform-core/echo-service
    newTag: unpromoted
  - name: worker-service
    newName: 123456789.dkr.ecr.eu-west-1.amazonaws.com/platform-core/worker-service
    newTag: unpromoted
  - name: llm-gateway
    newName: 123456789.dkr.ecr.eu-west-1.amazonaws.com/platform-core/llm-gateway
    newTag: unpromoted
  - name: audio-api
    newName: 123456789.dkr.ecr.eu-west-1.amazonaws.com/platform-core/audio-api
    newTag: unpromoted
  - name: stt-worker
    newName: 123456789.dkr.ecr.eu-west-1.amazonaws.com/platform-core/stt-worker
    newTag: unpromoted
  - name: llm-worker
    newName: 123456789.dkr.ecr.eu-west-1.amazonaws.com/platform-core/llm-worker
    newTag: unpromoted
  - name: tts-worker
    newName: 123456789.dkr.ecr.eu-west-1.amazonaws.com/platform-core/tts-worker
    newTag: unpromoted
