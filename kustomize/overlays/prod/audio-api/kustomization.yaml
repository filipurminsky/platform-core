apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - ../../../base/audio-api

labels:
  - pairs:
      app.kubernetes.io/part-of: platform-core
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false

patches:
  - path: patch-resources.yaml
    target:
      kind: Deployment
      name: audio-api
  - path: patch-prod-env.yaml
    target:
      kind: Deployment
      name: audio-api

replicas:
  - name: audio-api
    count: 2

configMapGenerator:
  - name: env-config
    literals:
      - ENVIRONMENT=prod
      - LOG_LEVEL=info
generatorOptions:
  disableNameSuffixHash: true

# Pinned by immutable digest on promotion: docker-build.yaml runs
# `kustomize edit set image audio-api=<repo>@sha256:<digest>`. Never ':latest'
# in prod — Kyverno disallow-latest-tag is Enforce here. Until the first
# promotion this 'unpromoted' tag is un-pullable, so an un-promoted prod fails
# closed (ImagePullBackOff) instead of silently running a mutable tag.
images:
  - name: audio-api
    newName: 123456789.dkr.ecr.eu-west-1.amazonaws.com/platform-core/audio-api
    newTag: unpromoted
