apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - ../../../base/stt-worker
  - trigger-auth.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: platform-core
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false

patches:
  - path: patch-resources.yaml
    target:
      kind: Deployment
      name: stt-worker
  - path: patch-kafka-auth.yaml
    target:
      kind: Deployment
      name: stt-worker
  - path: patch-s3-prod.yaml
    target:
      kind: Deployment
      name: stt-worker
  - path: patch-scaledobject-kafka-auth.yaml
    target:
      kind: ScaledObject
      name: stt-worker

replicas:
  - name: stt-worker
    count: 0

# env-config (ENVIRONMENT/LOG_LEVEL) is a single namespace-wide ConfigMap owned
# by the worker-service Application; this app only references it via the
# Deployment's configMapKeyRef. Re-generating an identically-named ConfigMap here
# makes multiple ArgoCD Applications contend for apps/env-config (perpetual
# OutOfSync) — one owner, many readers.

# Pinned by immutable digest on promotion: docker-build.yaml runs
# `kustomize edit set image stt-worker=<repo>@sha256:<digest>`. Never
# ':latest' in prod — Kyverno disallow-latest-tag is Enforce here. Until the
# first promotion this 'unpromoted' tag is un-pullable, so an un-promoted prod
# fails closed (ImagePullBackOff) instead of silently running a mutable tag.
images:
  - name: stt-worker
    newName: 123456789.dkr.ecr.eu-west-1.amazonaws.com/platform-core/stt-worker
    newTag: unpromoted
