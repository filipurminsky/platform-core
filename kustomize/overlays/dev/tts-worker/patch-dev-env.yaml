# Dev environment overrides:
#   - TTS_BACKEND=stub (no Kokoro/torch — wiring demo, fast)
#   - S3 pointed at in-cluster MinIO (path-style, bucket audio-pipeline)
#   - Redis pointed at dev Redis in platform namespace
#
# TTS_BACKEND is env index 7 (0-based: ENVIRONMENT, LOG_LEVEL, KAFKA_BOOTSTRAP_SERVERS,
# KAFKA_TOPIC_IN, KAFKA_TOPIC_OUT, KAFKA_DLQ_TOPIC, KAFKA_CONSUMER_GROUP, TTS_BACKEND).
- op: replace
  path: /spec/template/spec/containers/0/env/7/value
  value: stub

# MinIO endpoint (dev; unset in prod)
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: S3_ENDPOINT_URL
    value: http://minio.platform.svc.cluster.local:9000

# S3 bucket (dev MinIO)
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: S3_BUCKET
    value: audio-pipeline

# MinIO credentials (dev-only static creds; matches the MinIO root user and audio-api).
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: AWS_ACCESS_KEY_ID
    value: minio

- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: AWS_SECRET_ACCESS_KEY
    value: minio123

# Redis (dev)
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: REDIS_URL
    value: redis://redis.platform.svc.cluster.local:6379/0
