# JSON6902 patch — Rollout is a CRD, so use explicit ops. A strategic-merge
# patch on a schema-less CRD would replace the whole containers list.
- op: replace
  path: /spec/replicas
  value: 1
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
