apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

# Dev-specific patches
patches:
  # echo-service is a Rollout (canary) — JSON patch for replicas + smaller resources
  - path: patch-echo-resources.yaml
    target:
      kind: Rollout
      name: echo-service

  # worker-service: reduced resources for kind
  - path: patch-resources.yaml
    target:
      kind: Deployment
      name: worker-service

  # vLLM: swap to CPU model (TinyLlama-1.1B); remove GPU requirements
  - path: patch-vllm-model.yaml
    target:
      kind: Deployment
      name: vllm-inference

  # vLLM: use smaller PVC with local hostPath storage class
  - path: patch-vllm-pvc.yaml
    target:
      kind: PersistentVolumeClaim
      name: vllm-model-cache

# Note: Kafka dev/prod config (replica count, auth) is handled separately
# in kubernetes/platform/kafka/ via its own kustomize overlays.

replicas:
  - name: worker-service
    count: 0          # KEDA manages; starts at zero
  - name: vllm-inference
    count: 0          # KEDA manages
  # echo-service replicas set via patch-echo-resources.yaml (Rollout, unsupported by replicas transformer)

configMapGenerator:
  - name: env-config
    literals:
      - ENVIRONMENT=dev
      - LOG_LEVEL=debug

images:
  - name: echo-service
    newTag: latest
  - name: worker-service
    newTag: latest
  - name: llm-gateway
    newTag: latest
